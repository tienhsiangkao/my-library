<!-- Reader UI only. Edit manually. No import script may overwrite this file. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ .Title }}</title>

    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js"></script>

    <style>
        :root {
            --bg: #0f1115;
            --panel: #171a21;
            --panel-2: #1d2330;
            --text: #e8ecf3;
            --muted: #9aa4b2;
            --accent: #4f8cff;
            --border: rgba(255,255,255,0.08);
            --shadow: 0 10px 30px rgba(0,0,0,0.28);
            --reader-max: 860px;
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: linear-gradient(180deg, #0d1015 0%, #11161d 100%);
            color: var(--text);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        body {
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button {
            border: none;
            cursor: pointer;
            font: inherit;
        }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 14px;
            border-bottom: 1px solid var(--border);
            background: rgba(15,17,21,0.88);
            backdrop-filter: blur(10px);
        }

        .top-left,
        .top-right {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }

        .nav-btn,
        .control-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 40px;
            padding: 0 14px;
            border-radius: 12px;
            background: rgba(255,255,255,0.05);
            color: var(--text);
            border: 1px solid var(--border);
            white-space: nowrap;
        }

        .nav-btn:hover,
        .control-btn:hover {
            background: rgba(255,255,255,0.08);
        }

        .book-meta {
            min-width: 0;
        }

        .book-title {
            margin: 0;
            font-size: 16px;
            line-height: 1.25;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .book-subtitle {
            margin: 4px 0 0;
            font-size: 12px;
            color: var(--muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #topbar-right {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            min-width: 0;
            flex-shrink: 0;
        }

        #mode-switcher {
            display: flex;
            align-items: center;
            gap: 4px;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 3px;
        }

        .mode-btn {
            border: none;
            background: transparent;
            color: var(--text);
            font-size: 12px;
            line-height: 1;
            padding: 8px 10px;
            cursor: pointer;
            border-radius: 8px;
        }

        .mode-btn:hover {
            background: rgba(255,255,255,0.06);
        }

        .mode-btn.active {
            background: #2f6fed;
            color: #fff;
        }

        .shell {
            flex: 1;
            min-height: 0;
            display: flex;
            overflow: hidden;
        }

        .sidebar {
            width: 290px;
            flex: 0 0 290px;
            border-right: 1px solid var(--border);
            background: rgba(255,255,255,0.02);
            overflow-y: auto;
            padding: 16px 14px 18px;
        }

        .sidebar h2 {
            margin: 0 0 12px;
            font-size: 14px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--muted);
        }

        .toc-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .toc-item {
            display: block;
            width: 100%;
            padding: 10px 12px;
            border-radius: 12px;
            border: 1px solid transparent;
            background: transparent;
            color: #dbe2ee;
            text-align: left;
            font-size: 14px;
            line-height: 1.35;
        }

        .toc-item:hover,
        .toc-item.active {
            background: rgba(79,140,255,0.12);
            border-color: rgba(79,140,255,0.24);
        }

        .main {
            flex: 1;
            min-width: 0;
            min-height: 0;
            display: flex;
            flex-direction: column;
        }

        .stage {
            flex: 1;
            min-height: 0;
            display: flex;
            justify-content: center;
            align-items: stretch;
            padding: 18px;
            overflow: hidden;
        }

        #viewer-flow,
        #viewer-rendition {
            width: 100%;
            max-width: var(--reader-max);
            min-height: 0;
            border-radius: 18px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            background: #f8f5ef;
            color: #1f2630;
        }

        #viewer-flow {
            display: none;
            overflow-y: auto;
            padding: 28px 24px 40px;
            line-height: 1.8;
            font-size: 18px;
        }

        #viewer-rendition {
            display: none;
            overflow: hidden;
            min-height: 100%;
        }

        .status {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 220px;
            color: #475569;
            font-size: 16px;
        }

        #viewer-flow h1,
        #viewer-flow h2,
        #viewer-flow h3,
        #viewer-flow h4,
        #viewer-flow h5,
        #viewer-flow h6 {
            position: static !important;
            display: block !important;
            line-height: 1.35 !important;
            margin: 1.4em 0 0.7em !important;
            color: #111827 !important;
            letter-spacing: normal !important;
            overflow-wrap: break-word;
        }

        #viewer-flow p,
        #viewer-flow li,
        #viewer-flow blockquote {
            overflow-wrap: break-word;
        }

        #viewer-flow img,
        #viewer-flow svg,
        #viewer-flow video,
        #viewer-flow canvas,
        #viewer-flow table {
            max-width: 100% !important;
            height: auto !important;
        }

        #viewer-flow pre,
        #viewer-flow code {
            white-space: pre-wrap;
            word-break: break-word;
        }

        #viewer-flow a {
            color: #1d4ed8;
            text-decoration: underline;
        }

        .controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 12px 14px calc(12px + env(safe-area-inset-bottom));
            border-top: 1px solid var(--border);
            background: rgba(15,17,21,0.88);
            backdrop-filter: blur(10px);
        }

        .controls-left,
        .controls-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .chapter-info {
            min-width: 0;
            color: var(--muted);
            font-size: 14px;
            text-align: center;
            padding: 0 10px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .drawer-backdrop {
            display: none;
        }

        @media (max-width: 900px) {
            .sidebar {
                position: fixed;
                top: 0;
                left: 0;
                z-index: 70;
                width: min(82vw, 320px);
                height: 100dvh;
                transform: translateX(-100%);
                transition: transform 0.22s ease;
                background: #121721;
                box-shadow: 0 20px 50px rgba(0,0,0,0.45);
            }

            body.toc-open .sidebar {
                transform: translateX(0);
            }

            .drawer-backdrop {
                position: fixed;
                inset: 0;
                z-index: 60;
                background: rgba(0,0,0,0.45);
            }

            body.toc-open .drawer-backdrop {
                display: block;
            }

            .stage {
                padding: 12px;
            }

            #viewer-flow,
            #viewer-rendition {
                border-radius: 14px;
            }

            #viewer-flow {
                padding: 22px 16px 28px;
                font-size: 17px;
            }
        }

        @media (max-width: 820px) {
            #mode-switcher {
                gap: 2px;
                padding: 2px;
            }

            .mode-btn {
                font-size: 11px;
                padding: 7px 8px;
            }
        }

        @media (max-width: 640px) {
            .chapter-info {
                font-size: 12px;
            }
        }

        @media (max-width: 520px) {
            .topbar {
                align-items: flex-start;
            }

            .top-left {
                flex: 1;
                min-width: 0;
            }

            .controls {
                display: grid;
                grid-template-columns: 1fr auto 1fr;
                align-items: center;
            }

            .controls-left {
                justify-content: flex-start;
            }

            .controls-right {
                justify-content: flex-end;
            }

            .chapter-info {
                text-align: center;
                font-size: 11px;
            }
        }

        @media (orientation: landscape) and (max-width: 900px) {
            .topbar {
                padding-top: 8px;
                padding-bottom: 8px;
            }

            .stage {
                padding: 8px;
            }

            #viewer-flow {
                padding: 18px 16px 22px;
            }

            .controls {
                padding-top: 8px;
                padding-bottom: calc(8px + env(safe-area-inset-bottom));
            }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="top-left">
            <a class="nav-btn" id="backBtn" href="../">← Library</a>
            <button class="nav-btn" id="menuBtn" type="button">☰ Contents</button>

            <div class="book-meta">
                <h1 class="book-title">{{ .Title }}</h1>
                <p class="book-subtitle">{{ or .Params.author "Unknown Author" }}</p>
            </div>
        </div>

        <div class="top-right" id="topbar-right">
            <div id="mode-switcher" aria-label="Reading mode">
                <button class="mode-btn" data-mode="flow" type="button">Flow</button>
                <button class="mode-btn" data-mode="rendition" type="button">Rendition</button>
            </div>
        </div>
    </header>

    <div class="drawer-backdrop" id="drawerBackdrop"></div>

    <div class="shell">
        <aside class="sidebar" id="sidebar">
            <h2>Contents</h2>
            <div class="toc-list" id="tocList">
                <button class="toc-item active" type="button">Loading…</button>
            </div>
        </aside>

        <main class="main">
            <section class="stage">
                <div id="viewer-flow">
                    <div class="status">Loading book…</div>
                </div>
                <div id="viewer-rendition"></div>
            </section>

            <footer class="controls">
                <div class="controls-left">
                    <button class="control-btn" id="prevBtn" type="button">← Prev</button>
                </div>

                <div class="chapter-info" id="pageInfo">Preparing book…</div>

                <div class="controls-right">
                    <button class="control-btn" id="nextBtn" type="button">Next →</button>
                </div>
            </footer>
        </main>
    </div>

    <script>
        (() => {
            const bookUrl = `{{ (printf "books/%s" .Params.epub_file) | relURL }}`;
            const defaultMode = '{{ .Params.reader_mode | default "flow" }}'.toLowerCase();
            const modeStorageKey = `reader-mode:${bookUrl}`;
            let preferredMode = (localStorage.getItem(modeStorageKey) || defaultMode).toLowerCase();

            if (!['flow', 'rendition'].includes(preferredMode)) {
                preferredMode = 'flow';
            }

            const book = ePub(bookUrl);

            const viewerFlow = document.getElementById('viewer-flow');
            const viewerRendition = document.getElementById('viewer-rendition');
            const tocList = document.getElementById('tocList');
            const pageInfo = document.getElementById('pageInfo');
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            const menuBtn = document.getElementById('menuBtn');
            const drawerBackdrop = document.getElementById('drawerBackdrop');
            const modeButtons = document.querySelectorAll('.mode-btn');

            let rendition = null;
            let spineItems = [];
            let currentHref = '';
            let currentDisplayHref = '';
            let currentSectionIndex = 0;
            let activeMode = 'flow';
            let resizeTimer = null;

            function effectiveMode() {
                return preferredMode === 'rendition' ? 'rendition' : 'flow';
            }

            function setMode(mode) {
                activeMode = mode;
                viewerFlow.style.display = mode === 'flow' ? 'block' : 'none';
                viewerRendition.style.display = mode === 'rendition' ? 'block' : 'none';
            }

            function updateModeButtons() {
                modeButtons.forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.mode === preferredMode);
                });
            }

            function getCurrentDisplayHref() {
                return currentDisplayHref || currentHref || '';
            }

            function nextFrame() {
                return new Promise(resolve => requestAnimationFrame(resolve));
            }

            async function resizeRenditionSafe() {
                if (!rendition || activeMode !== 'rendition') return;

                await nextFrame();
                await nextFrame();

                const width = viewerRendition.clientWidth || viewerRendition.offsetWidth || 1;
                const height = viewerRendition.clientHeight || viewerRendition.offsetHeight || 1;
                rendition.resize(width, height);
            }

            function openToc() {
                document.body.classList.add('toc-open');
            }

            function closeToc() {
                document.body.classList.remove('toc-open');
            }

            menuBtn.addEventListener('click', () => {
                document.body.classList.contains('toc-open') ? closeToc() : openToc();
            });

            drawerBackdrop.addEventListener('click', closeToc);

            function getFragment(href) {
                if (!href || !href.includes('#')) return '';
                return href.split('#').slice(1).join('#');
            }

            function normalizeHref(href) {
                if (!href) return '';

                let result = String(href).trim();

                if (!result) return '';

                if (result.includes('#')) {
                    result = result.split('#')[0];
                }

                try {
                    result = decodeURIComponent(result);
                } catch {}

                result = result.replace(/^\.?\//, '');
                return result;
            }

            function flattenToc(items, depth = 0) {
                const out = [];
                (items || []).forEach(item => {
                    out.push({
                        label: item.label || 'Untitled',
                        href: item.href || '',
                        depth
                    });
                    if (item.subitems && item.subitems.length) {
                        out.push(...flattenToc(item.subitems, depth + 1));
                    }
                });
                return out;
            }

            function buildToc(items) {
                const flat = flattenToc(items || []);
                tocList.innerHTML = '';

                if (!flat.length) {
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'toc-item active';
                    btn.textContent = 'No table of contents';
                    tocList.appendChild(btn);
                    return;
                }

                flat.forEach(item => {
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'toc-item';
                    btn.dataset.href = normalizeHref(item.href);
                    btn.style.paddingLeft = `${12 + item.depth * 14}px`;
                    btn.textContent = item.label;

                    btn.addEventListener('click', async () => {
                        closeToc();
                        await renderSection(item.href);
                    });

                    tocList.appendChild(btn);
                });
            }

            function markActiveToc(href) {
                const clean = normalizeHref(href);
                tocList.querySelectorAll('.toc-item').forEach(el => {
                    el.classList.toggle('active', el.dataset.href === clean);
                });
            }

            function updatePageInfo() {
                const total = spineItems.length || 0;
                if (!total) {
                    pageInfo.textContent = `No chapters · ${activeMode}`;
                    return;
                }
                pageInfo.textContent = `Chapter ${currentSectionIndex + 1} / ${total} · ${activeMode}`;
            }

            function updateButtons() {
                const total = spineItems.length || 0;
                prevBtn.disabled = currentSectionIndex <= 0;
                nextBtn.disabled = currentSectionIndex >= total - 1;
                prevBtn.style.opacity = prevBtn.disabled ? '0.45' : '1';
                nextBtn.style.opacity = nextBtn.disabled ? '0.45' : '1';
            }

            function showError(message) {
                const text = String(message || 'Unknown error');
                if (activeMode === 'rendition') {
                    viewerRendition.innerHTML = '';
                    viewerFlow.style.display = 'block';
                    viewerRendition.style.display = 'none';
                    viewerFlow.innerHTML = `<div class="status" style="padding:24px;color:#7f1d1d;">${text}</div>`;
                } else {
                    viewerFlow.innerHTML = `<div class="status" style="padding:24px;color:#7f1d1d;">${text}</div>`;
                }
            }

            function getSectionByHref(href) {
                const clean = normalizeHref(href);
                try {
                    const direct = book.spine.get(clean);
                    if (direct) return direct;
                } catch {}

                const found = spineItems.find(item => {
                    if (!item || !item.href) return false;
                    return normalizeHref(item.href) === clean;
                });

                return found || spineItems[0] || null;
            }

            function scrollToFragmentInFlow(fragment) {
                if (!fragment) return;

                let target = null;
                try {
                    const safe = CSS.escape(fragment);
                    target =
                        viewerFlow.querySelector(`#${safe}`) ||
                        viewerFlow.querySelector(`[name="${safe}"]`);
                } catch {
                    target =
                        viewerFlow.querySelector(`[id="${fragment}"]`) ||
                        viewerFlow.querySelector(`[name="${fragment}"]`);
                }

                if (target) {
                    target.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }
            }

            function rewriteFlowResources() {
                viewerFlow.querySelectorAll('a[href]').forEach(a => {
                    const raw = a.getAttribute('href') || '';
                    if (!raw) return;

                    if (
                        raw.startsWith('http://') ||
                        raw.startsWith('https://') ||
                        raw.startsWith('mailto:') ||
                        raw.startsWith('tel:')
                    ) {
                        a.setAttribute('target', '_blank');
                        a.setAttribute('rel', 'noopener noreferrer');
                        return;
                    }

                    a.addEventListener('click', async (e) => {
                        e.preventDefault();

                        if (raw.startsWith('#')) {
                            scrollToFragmentInFlow(raw.slice(1));
                            return;
                        }

                        await renderSection(raw);
                    });
                });
            }

            async function ensureRendition() {
                if (rendition) return rendition;

                rendition = book.renderTo('viewer-rendition', {
                    width: '100%',
                    height: '100%',
                    flow: 'paginated',
                    spread: 'auto',
                    manager: 'default'
                });

                rendition.themes.default({
                    body: {
                        background: '#f8f5ef',
                        color: '#1f2630',
                        'line-height': '1.7'
                    },
                    'p, li': {
                        'font-size': '1rem'
                    }
                });

                rendition.on('relocated', (location) => {
                    const start = location && location.start ? location.start : {};
                    if (start.href) {
                        currentHref = normalizeHref(start.href);
                        currentDisplayHref = start.cfi || start.href || currentHref;
                    }
                    if (typeof start.index === 'number') {
                        currentSectionIndex = start.index;
                    } else {
                        const idx = spineItems.findIndex(item => normalizeHref(item.href) === currentHref);
                        currentSectionIndex = idx >= 0 ? idx : 0;
                    }
                    markActiveToc(currentHref);
                    updateButtons();
                    updatePageInfo();
                });

                return rendition;
            }

            async function renderFlow(displayHref, cleanHref, section) {
                setMode('flow');
                currentDisplayHref = displayHref || cleanHref;

                await section.load(book.load.bind(book));

                let markup = '';
                try {
                    markup = await section.render();
                } catch {
                    if (section.document && section.document.body) {
                        markup = section.document.body.innerHTML;
                    } else {
                        throw new Error('Failed to render section in flow mode.');
                    }
                }

                const parsed = new DOMParser().parseFromString(markup, 'text/html');
                if (!parsed || !parsed.body) {
                    throw new Error('Failed to parse section HTML.');
                }

                viewerFlow.innerHTML = parsed.body.innerHTML;
                rewriteFlowResources();
                viewerFlow.scrollTop = 0;

                currentHref = cleanHref;
                currentSectionIndex = typeof section.index === 'number' ? section.index : 0;
                markActiveToc(cleanHref);
                updateButtons();
                updatePageInfo();

                const fragment = getFragment(displayHref);
                if (fragment) {
                    scrollToFragmentInFlow(fragment);
                }

                if (typeof section.unload === 'function') {
                    section.unload();
                }
            }

            async function renderRendition(displayHref, cleanHref, section) {
                setMode('rendition');
                currentDisplayHref = displayHref || cleanHref;

                const r = await ensureRendition();

                currentHref = cleanHref;
                currentSectionIndex = typeof section.index === 'number' ? section.index : 0;
                markActiveToc(cleanHref);
                updateButtons();
                updatePageInfo();

                await resizeRenditionSafe();
                await r.display(currentDisplayHref);
                await resizeRenditionSafe();
            }

            async function renderSection(href, forcedMode = null) {
                const displayHref = String(href || '');
                const cleanHref = normalizeHref(displayHref);
                const section = getSectionByHref(cleanHref);

                if (!section) {
                    showError(`Render failed: section not found: ${cleanHref}`);
                    return;
                }

                const primaryMode = forcedMode || effectiveMode();
                const backupMode = primaryMode === 'rendition' ? 'flow' : 'rendition';

                try {
                    if (primaryMode === 'rendition') {
                        await renderRendition(displayHref, cleanHref, section);
                    } else {
                        await renderFlow(displayHref, cleanHref, section);
                    }
                } catch (err1) {
                    console.warn(`Primary render failed in ${primaryMode}, trying ${backupMode}`, err1);

                    try {
                        if (backupMode === 'rendition') {
                            await renderRendition(displayHref, cleanHref, section);
                        } else {
                            await renderFlow(displayHref, cleanHref, section);
                        }
                    } catch (err2) {
                        console.error('Render error:', err1, err2);
                        showError(`This chapter failed in both modes: ${err2.message || err2}`);
                    }
                }
            }

            prevBtn.addEventListener('click', async () => {
                if (activeMode === 'rendition' && rendition) {
                    await rendition.prev();
                    return;
                }

                if (currentSectionIndex > 0) {
                    const prev = spineItems[currentSectionIndex - 1];
                    if (prev) await renderSection(prev.href);
                }
            });

            nextBtn.addEventListener('click', async () => {
                if (activeMode === 'rendition' && rendition) {
                    await rendition.next();
                    return;
                }

                if (currentSectionIndex < spineItems.length - 1) {
                    const next = spineItems[currentSectionIndex + 1];
                    if (next) await renderSection(next.href);
                }
            });

            modeButtons.forEach(btn => {
                btn.addEventListener('click', async () => {
                    preferredMode = btn.dataset.mode;
                    localStorage.setItem(modeStorageKey, preferredMode);
                    updateModeButtons();

                    const target = getCurrentDisplayHref() || (spineItems[0] && spineItems[0].href) || '';
                    await renderSection(target, preferredMode);
                });
            });

            window.addEventListener('resize', () => {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(async () => {
                    if (!document.body.classList.contains('toc-open')) return;
                    if (window.innerWidth > 900) {
                        closeToc();
                    }
                }, 120);
            });

            window.addEventListener('resize', async () => {
                if (activeMode === 'rendition') {
                    await resizeRenditionSafe();
                }
            });

            window.addEventListener('orientationchange', async () => {
                setTimeout(async () => {
                    if (activeMode === 'rendition') {
                        await resizeRenditionSafe();
                    }
                }, 180);
            });

            book.ready.then(async () => {
                spineItems = book.spine && book.spine.items ? book.spine.items : [];
                buildToc(book.navigation && book.navigation.toc ? book.navigation.toc : []);
                updateModeButtons();

                const initialTarget = (spineItems[0] && spineItems[0].href) || '';
                await renderSection(initialTarget, effectiveMode());
            }).catch(err => {
                console.error('Book init error:', err);
                setMode('flow');
                showError('Failed to open this book.');
            });
        })();
    </script>
</body>
</html>
