<!-- Reader UI only. Edit manually. No import script may overwrite this file. -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>{{ .Title }}</title>

    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js"></script>

    <style>
        :root {
            --bg: #0f1115;
            --panel: #171a21;
            --panel-2: #1d2330;
            --text: #e8ecf3;
            --muted: #9aa4b2;
            --accent: #4f8cff;
            --border: rgba(255,255,255,0.08);
            --shadow: 0 12px 36px rgba(0,0,0,0.32);
            --paper: #f8f5ef;
            --paper-text: #1f2630;

            --sidebar-width: 290px;
            --topbar-height: 58px;
            --controls-height: 60px;
            --reader-width: 1640px;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #0d1015 0%, #11161d 100%);
            color: var(--text);
            font-family: Inter, "PingFang SC", "SF Pro Display", "Segoe UI", sans-serif;
            overflow: hidden;
        }

        body {
            overflow: hidden;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button {
            border: none;
            cursor: pointer;
            font: inherit;
        }

        #app {
            display: flex;
            width: 100%;
            height: 100dvh;
            min-height: 100dvh;
            overflow: hidden;
            background: transparent;
        }

        #sidebar-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.45);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
            z-index: 40;
        }

        #sidebar {
            width: var(--sidebar-width);
            flex-shrink: 0;
            background: rgba(15,17,21,0.82);
            border-right: 1px solid var(--border);
            overflow-y: auto;
            padding: 18px 16px 24px;
            z-index: 50;
            backdrop-filter: blur(10px);
        }

        #sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 12px;
        }

        #sidebar h3 {
            margin: 0;
            color: var(--accent);
            font-size: 18px;
        }

        #closeSidebarBtn {
            display: none;
            border: none;
            background: transparent;
            color: var(--text);
            font-size: 24px;
            line-height: 1;
            padding: 4px 8px;
            border-radius: 10px;
        }

        .toc-item {
            display: block;
            width: 100%;
            text-align: left;
            padding: 10px 10px;
            border: 1px solid transparent;
            border-radius: 12px;
            background: transparent;
            color: #cfd7e3;
            font-size: 14px;
            line-height: 1.45;
            word-break: break-word;
            transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
        }

        .toc-item:hover {
            color: #fff;
            background: rgba(255,255,255,0.06);
            border-color: rgba(255,255,255,0.04);
        }

        .toc-item.active {
            color: #fff;
            background: rgba(79,140,255,0.16);
            border-color: rgba(79,140,255,0.22);
        }

        .toc-depth-1 { padding-left: 22px; }
        .toc-depth-2 { padding-left: 34px; }
        .toc-depth-3 { padding-left: 46px; }

        #main {
            flex: 1;
            min-width: 0;
            min-height: 0;
            display: flex;
            flex-direction: column;
            background: transparent;
            overflow: hidden;
            position: relative;
        }

        #topbar {
            height: var(--topbar-height);
            min-height: var(--topbar-height);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 0 14px;
            background: rgba(15,17,21,0.78);
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(10px);
            z-index: 30;
            flex-shrink: 0;
            transition: opacity 0.18s ease;
        }

        #topbar-left,
        #topbar-right {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
        }

        .top-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 40px;
            padding: 0 14px;
            border-radius: 12px;
            background: rgba(255,255,255,0.06);
            color: var(--text);
            border: 1px solid var(--border);
            white-space: nowrap;
        }

        .top-btn:hover {
            background: rgba(255,255,255,0.1);
        }

        #menuBtn {
            display: none;
        }

        #topbar-title {
            flex: 1;
            min-width: 0;
            font-size: 15px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text);
            text-align: center;
        }

        #mode-switcher {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px;
            border-radius: 14px;
            background: rgba(255,255,255,0.06);
            border: 1px solid var(--border);
        }

        .mode-btn {
            padding: 8px 12px;
            border-radius: 10px;
            background: transparent;
            color: var(--muted);
            font-size: 13px;
            font-weight: 700;
        }

        .mode-btn.active {
            background: rgba(79,140,255,0.18);
            color: #eef4ff;
        }

        #viewer-wrap {
            flex: 1;
            min-height: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: stretch;
            padding: 18px;
            position: relative;
        }

        .viewer-panel {
            display: none;
            width: min(var(--reader-width), calc(100vw - var(--sidebar-width) - 44px));
            max-width: none;
            height: 100%;
            min-height: 0;
            background: var(--paper);
            color: var(--paper-text);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: var(--shadow);
        }

        .viewer-panel.active {
            display: block;
        }

        #viewer-flow {
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
            touch-action: pan-y;
            padding: 44px 52px;
            line-height: 1.9;
            font-size: 19px;
        }

        #viewer-rendition {
            overflow: hidden;
            width: 100%;
            height: 100%;
        }

        .status {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 220px;
            color: #475569;
            font-size: 16px;
        }

        .error {
            color: #b42318;
        }

        #viewer-flow h1,
        #viewer-flow h2,
        #viewer-flow h3,
        #viewer-flow h4,
        #viewer-flow h5,
        #viewer-flow h6 {
            position: static !important;
            display: block !important;
            line-height: 1.38 !important;
            margin: 1.35em 0 0.72em !important;
            color: #111827 !important;
            letter-spacing: normal !important;
            float: none !important;
            clear: both !important;
            overflow-wrap: break-word;
        }

        #viewer-flow p,
        #viewer-flow li,
        #viewer-flow blockquote,
        #viewer-flow td,
        #viewer-flow th {
            overflow-wrap: break-word;
        }

        #viewer-flow img,
        #viewer-flow svg,
        #viewer-flow video,
        #viewer-flow canvas,
        #viewer-flow table,
        #viewer-flow iframe {
            max-width: 100% !important;
            height: auto !important;
        }

        #viewer-flow pre,
        #viewer-flow code {
            white-space: pre-wrap;
            word-break: break-word;
        }

        #viewer-flow a {
            color: #1d4ed8;
            text-decoration: underline;
        }

        #viewer-flow blockquote {
            margin: 1em 0;
            padding-left: 1em;
            border-left: 4px solid #d5dbe5;
            color: #334155;
        }

        #viewer-flow hr {
            border: none;
            border-top: 1px solid #d8dee8;
            margin: 1.6em 0;
        }

        #viewer-flow table {
            border-collapse: collapse;
            display: block;
            overflow-x: auto;
        }

        #viewer-flow th,
        #viewer-flow td {
            border: 1px solid #d8dee8;
            padding: 0.45em 0.6em;
        }

        .controls {
            height: var(--controls-height);
            min-height: var(--controls-height);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
            border-top: 1px solid var(--border);
            background: rgba(15,17,21,0.78);
            backdrop-filter: blur(10px);
            flex-shrink: 0;
            z-index: 30;
            transition: opacity 0.18s ease;
        }

        .controls-left,
        .controls-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 84px;
            min-height: 40px;
            padding: 0 14px;
            border-radius: 12px;
            background: rgba(255,255,255,0.06);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .nav-btn:hover {
            background: rgba(255,255,255,0.1);
        }

        .nav-btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        #page-info {
            flex: 1;
            min-width: 0;
            text-align: center;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.4;
            padding: 0 8px;
            word-break: break-word;
        }

        #message {
            position: absolute;
            top: calc(var(--topbar-height) + 10px);
            left: 14px;
            right: 14px;
            z-index: 80;
            display: none;
            padding: 12px 14px;
            border-radius: 12px;
            background: rgba(180, 35, 24, 0.95);
            color: #fff;
            font-size: 14px;
            line-height: 1.45;
            box-shadow: 0 10px 24px rgba(0,0,0,0.28);
        }

        @media (max-width: 1180px) {
            .viewer-panel {
                width: calc(100vw - var(--sidebar-width) - 28px);
            }

            #viewer-flow {
                padding: 34px 30px;
                font-size: 17px;
            }
        }

        @media (max-width: 900px) {
            #menuBtn {
                display: inline-flex;
            }

            #sidebar {
                position: fixed;
                top: 0;
                left: 0;
                width: min(84vw, var(--sidebar-width));
                max-width: 84vw;
                height: 100dvh;
                transform: translateX(-100%);
                transition: transform 0.22s ease;
                box-shadow: 0 12px 36px rgba(0,0,0,0.45);
                padding-top: calc(16px + env(safe-area-inset-top));
            }

            #closeSidebarBtn {
                display: inline-block;
            }

            body.sidebar-open #sidebar {
                transform: translateX(0);
            }

            body.sidebar-open #sidebar-overlay {
                opacity: 1;
                pointer-events: auto;
            }

            #topbar {
                min-height: 50px;
                height: 50px;
                padding-left: max(10px, env(safe-area-inset-left));
                padding-right: max(10px, env(safe-area-inset-right));
            }

            #topbar-title {
                font-size: 13px;
            }

            #viewer-wrap {
                padding: 0;
            }

            .viewer-panel {
                width: 100%;
                border-radius: 0;
                box-shadow: none;
            }

            #viewer-flow {
                padding: 20px 16px 26px;
                font-size: 16px;
                line-height: 1.82;
            }

            .controls {
                display: none;
            }

            body.chrome-hidden #topbar {
                opacity: 0;
                pointer-events: none;
            }

            body.chrome-hidden #message {
                top: 12px;
            }
        }

        @media (hover: none) and (pointer: coarse) and (orientation: landscape) and (max-height: 520px) {
            :root {
                --topbar-height: 48px;
                --controls-height: 50px;
            }

            #topbar {
                padding: 0 8px;
            }

            #sidebar {
                width: min(68vw, 340px);
                max-width: 68vw;
            }

            #viewer-flow {
                padding: 12px 14px 16px;
                font-size: 15px;
                line-height: 1.72;
            }

            #viewer-flow h1,
            #viewer-flow h2,
            #viewer-flow h3,
            #viewer-flow h4,
            #viewer-flow h5,
            #viewer-flow h6 {
                margin: 1.1em 0 0.65em !important;
                line-height: 1.3 !important;
            }
        }
    </style>
</head>
<body>
    <div id="sidebar-overlay"></div>

    <div id="app">
        <aside id="sidebar">
            <div id="sidebar-header">
                <h3>目录</h3>
                <button id="closeSidebarBtn" type="button" aria-label="Close">×</button>
            </div>
            <div id="toc-list">
                <button class="toc-item" type="button">Loading TOC…</button>
            </div>
        </aside>

        <main id="main">
            <div id="topbar">
                <div id="topbar-left">
                    <a id="backBtn" class="top-btn" href="{{ "/books/" | relURL }}">← Library</a>
                    <button id="menuBtn" class="top-btn" type="button">目录</button>
                </div>

                <div id="topbar-title">{{ .Title }}</div>

                <div id="topbar-right">
                    <div id="mode-switcher">
                        <button id="flowBtn" class="mode-btn" type="button">Flow</button>
                        <button id="renditionBtn" class="mode-btn" type="button">Rendition</button>
                    </div>
                </div>
            </div>

            <div id="viewer-wrap">
                <div id="flowPanel" class="viewer-panel">
                    <div id="viewer-flow">
                        <div class="status">Loading…</div>
                    </div>
                </div>

                <div id="renditionPanel" class="viewer-panel">
                    <div id="viewer-rendition"></div>
                </div>
            </div>

            <div class="controls">
                <div class="controls-left">
                    <button id="prevBtn" class="nav-btn" type="button">← Prev</button>
                </div>

                <div id="page-info">Loading…</div>

                <div class="controls-right">
                    <button id="nextBtn" class="nav-btn" type="button">Next →</button>
                </div>
            </div>

            <div id="message"></div>
        </main>
    </div>

    <script>
        const EPUB_URL = `{{ (printf "books/%s" .Params.epub_file) | relURL }}`;
        const MODE_STORAGE_KEY = "library_reader_mode";
        const DEFAULT_MODE = `{{ .Params.reader_mode | default "flow" }}`;

        const MOBILE_BREAKPOINT = 900;
        const TAP_EDGE_RATIO = 0.32;
        const TOUCH_MOVE_THRESHOLD = 14;
        const TAP_MAX_DURATION_MS = 350;
        const NAV_LOCK_MS = 220;

        const bodyEl = document.body;
        const sidebarOverlayEl = document.getElementById("sidebar-overlay");
        const closeSidebarBtn = document.getElementById("closeSidebarBtn");
        const menuBtn = document.getElementById("menuBtn");
        const tocList = document.getElementById("toc-list");

        const flowPanel = document.getElementById("flowPanel");
        const renditionPanel = document.getElementById("renditionPanel");
        const viewerFlow = document.getElementById("viewer-flow");
        const viewerRendition = document.getElementById("viewer-rendition");

        const flowBtn = document.getElementById("flowBtn");
        const renditionBtn = document.getElementById("renditionBtn");
        const prevBtn = document.getElementById("prevBtn");
        const nextBtn = document.getElementById("nextBtn");
        const pageInfo = document.getElementById("page-info");
        const messageEl = document.getElementById("message");

        let book = null;
        let rendition = null;
        let spineItems = [];
        let tocEntries = [];

        let currentMode = "flow";
        let currentHref = "";
        let currentDisplayHref = "";
        let currentSectionIndex = 0;
        let chromeVisible = true;
        let navBusy = false;

        function isMobileLike() {
            return window.matchMedia(`(max-width: ${MOBILE_BREAKPOINT}px)`).matches;
        }

        function normalizeHref(href) {
            const raw = String(href || "").trim();
            if (!raw) return "";

            if (raw.startsWith("epubcfi(")) return raw;

            const noHash = raw.split("#")[0];
            return noHash.replace(/^(\.\/)+/, "");
        }

        function getFragment(href) {
            const raw = String(href || "");
            const idx = raw.indexOf("#");
            return idx >= 0 ? raw.slice(idx + 1) : "";
        }

        function isExternalHref(href) {
            return /^(https?:|mailto:|tel:|javascript:)/i.test(String(href || ""));
        }

        function closestAnchor(target) {
            if (!target) return null;
            const el = target.nodeType === 1 ? target : target.parentElement;
            return el && el.closest ? el.closest("a[href]") : null;
        }

        function getTapZone(clientX, width = window.innerWidth) {
            const ratio = clientX / Math.max(width, 1);
            if (ratio < TAP_EDGE_RATIO) return "prev";
            if (ratio > 1 - TAP_EDGE_RATIO) return "next";
            return "center";
        }

        function closeSidebar() {
            bodyEl.classList.remove("sidebar-open");
        }

        function toggleSidebar() {
            bodyEl.classList.toggle("sidebar-open");
        }

        function setChromeVisible(visible) {
            chromeVisible = visible;
            bodyEl.classList.toggle("chrome-hidden", !visible);
        }

        function toggleChrome() {
            setChromeVisible(!chromeVisible);
        }

        function showError(text) {
            messageEl.textContent = text;
            messageEl.style.display = "block";
        }

        function clearError() {
            messageEl.style.display = "none";
            messageEl.textContent = "";
        }

        function getStoredMode() {
            try {
                const value = localStorage.getItem(MODE_STORAGE_KEY);
                return value === "flow" || value === "rendition" ? value : null;
            } catch {
                return null;
            }
        }

        function storeMode(mode) {
            try {
                localStorage.setItem(MODE_STORAGE_KEY, mode);
            } catch {}
        }

        function effectiveMode() {
            const stored = getStoredMode();
            if (stored) return stored;
            if (isMobileLike()) return "rendition";
            return DEFAULT_MODE === "rendition" ? "rendition" : "flow";
        }

        function setMode(mode) {
            currentMode = mode;
            storeMode(mode);

            flowPanel.classList.toggle("active", mode === "flow");
            renditionPanel.classList.toggle("active", mode === "rendition");
            flowBtn.classList.toggle("active", mode === "flow");
            renditionBtn.classList.toggle("active", mode === "rendition");

            clearError();
        }

        function flattenToc(items, depth = 0, out = []) {
            (items || []).forEach(item => {
                out.push({
                    label: (item.label || "Untitled").trim(),
                    href: item.href || "",
                    depth
                });
                if (item.subitems && item.subitems.length) {
                    flattenToc(item.subitems, depth + 1, out);
                }
            });
            return out;
        }

        function buildToc() {
            tocList.innerHTML = "";

            if (!tocEntries.length) {
                tocList.innerHTML = `<button class="toc-item" type="button">No TOC found</button>`;
                return;
            }

            tocEntries.forEach(item => {
                const btn = document.createElement("button");
                btn.type = "button";
                btn.className = `toc-item toc-depth-${Math.min(item.depth, 3)}`;
                btn.textContent = item.label;
                btn.dataset.href = item.href || "";
                btn.addEventListener("click", async () => {
                    await renderSection(item.href);
                    if (isMobileLike()) closeSidebar();
                });
                tocList.appendChild(btn);
            });

            markActiveToc(currentHref);
        }

        function markActiveToc(href) {
            const clean = normalizeHref(href);
            tocList.querySelectorAll(".toc-item").forEach(el => {
                const hit = normalizeHref(el.dataset.href || "") === clean;
                el.classList.toggle("active", hit);
            });
        }

        function getSectionByHref(href) {
            const clean = normalizeHref(href);
            if (!clean) return null;

            let section = null;
            try {
                section = book.spine.get(clean);
            } catch {}

            if (section) return section;

            const found = spineItems.find(item => normalizeHref(item.href) === clean);
            return found || null;
        }

        function getSectionByIndex(index) {
            if (index < 0 || index >= spineItems.length) return null;
            return spineItems[index] || null;
        }

        function updateButtons() {
            prevBtn.disabled = currentSectionIndex <= 0 && currentMode === "flow";
            nextBtn.disabled = currentSectionIndex >= spineItems.length - 1 && currentMode === "flow";
        }

        function updatePageInfo() {
            const modeText = currentMode === "rendition" ? "Paginated" : "Flow";
            const total = spineItems.length || 0;
            const chapter = total ? `${currentSectionIndex + 1}/${total}` : "0/0";

            let tocLabel = "";
            const hit = tocEntries.find(item => normalizeHref(item.href) === normalizeHref(currentHref));
            if (hit) tocLabel = hit.label;

            pageInfo.textContent = tocLabel
                ? `${modeText} · ${chapter} · ${tocLabel}`
                : `${modeText} · ${chapter}`;
        }

        function resolveRelativeHref(baseHref, href) {
            const base = normalizeHref(baseHref);
            const baseDir = base && base.includes("/") ? base.slice(0, base.lastIndexOf("/") + 1) : "";

            try {
                const url = new URL(String(href || ""), `https://epub.local/${baseDir}`);
                const cleanHref = url.pathname.replace(/^\/+/, "");
                const fragment = url.hash.replace(/^#/, "");
                return {
                    displayHref: fragment ? `${cleanHref}#${fragment}` : cleanHref,
                    cleanHref,
                    fragment
                };
            } catch {
                const raw = String(href || "");
                const parts = raw.split("#");
                return {
                    displayHref: raw,
                    cleanHref: normalizeHref(parts[0]),
                    fragment: parts[1] || ""
                };
            }
        }

        function scrollToFragmentInFlow(fragment) {
            if (!fragment) return;

            let target = null;

            try {
                const safe = window.CSS && CSS.escape ? CSS.escape(fragment) : fragment;
                target =
                    viewerFlow.querySelector(`#${safe}`) ||
                    viewerFlow.querySelector(`[name="${safe}"]`);
            } catch {
                target =
                    viewerFlow.querySelector(`[id="${fragment}"]`) ||
                    viewerFlow.querySelector(`[name="${fragment}"]`);
            }

            if (target) {
                target.scrollIntoView({ behavior: "auto", block: "start" });
            }
        }

        function rewriteFlowResources(section) {
            viewerFlow.querySelectorAll("[src]").forEach(el => {
                const src = el.getAttribute("src");
                if (!src || isExternalHref(src)) return;
                try {
                    el.setAttribute("src", section.resolve(src));
                } catch {}
            });

            viewerFlow.querySelectorAll("[poster]").forEach(el => {
                const poster = el.getAttribute("poster");
                if (!poster || isExternalHref(poster)) return;
                try {
                    el.setAttribute("poster", section.resolve(poster));
                } catch {}
            });

            viewerFlow.querySelectorAll("link[href]").forEach(el => {
                const href = el.getAttribute("href");
                if (!href || isExternalHref(href)) return;
                try {
                    el.setAttribute("href", section.resolve(href));
                } catch {}
            });

            viewerFlow.querySelectorAll("a[href]").forEach(a => {
                const raw = a.getAttribute("href") || "";
                if (!raw) return;

                if (isExternalHref(raw)) {
                    a.setAttribute("target", "_blank");
                    a.setAttribute("rel", "noopener noreferrer");
                    return;
                }

                a.addEventListener("click", async (e) => {
                    e.preventDefault();

                    if (raw.startsWith("#")) {
                        scrollToFragmentInFlow(raw.slice(1));
                        return;
                    }

                    const resolved = resolveRelativeHref(currentHref, raw);
                    await renderSection(resolved.displayHref);
                });
            });
        }

        function attachMobileTapRecognizer(target, options) {
            let startX = 0;
            let startY = 0;
            let startTime = 0;
            let moved = false;
            let startedOnAnchor = false;

            target.addEventListener("touchstart", (e) => {
                if (!isMobileLike()) return;
                if (!e.touches || e.touches.length !== 1) return;

                const t = e.touches[0];
                startX = t.clientX;
                startY = t.clientY;
                startTime = Date.now();
                moved = false;
                startedOnAnchor = !!closestAnchor(e.target);
            }, { passive: true });

            target.addEventListener("touchmove", (e) => {
                if (!isMobileLike()) return;
                if (!e.touches || e.touches.length !== 1) return;

                const t = e.touches[0];
                if (
                    Math.abs(t.clientX - startX) > TOUCH_MOVE_THRESHOLD ||
                    Math.abs(t.clientY - startY) > TOUCH_MOVE_THRESHOLD
                ) {
                    moved = true;
                }
            }, { passive: true });

            target.addEventListener("touchend", async (e) => {
                if (!isMobileLike()) return;
                if (startedOnAnchor) return;
                if (moved) return;
                if (Date.now() - startTime > TAP_MAX_DURATION_MS) return;
                if (!e.changedTouches || !e.changedTouches.length) return;

                const t = e.changedTouches[0];
                const width = typeof options.getWidth === "function" ? options.getWidth() : window.innerWidth;
                const zone = getTapZone(t.clientX, width);

                if (zone === "prev") {
                    await options.onPrev();
                } else if (zone === "next") {
                    await options.onNext();
                } else {
                    await options.onCenter();
                }
            }, { passive: true });
        }

        function installFlowTouchBehavior() {
            attachMobileTapRecognizer(viewerFlow, {
                getWidth: () => window.innerWidth,
                onPrev: async () => { await prevAction(); },
                onNext: async () => { await nextAction(); },
                onCenter: async () => { toggleChrome(); }
            });
        }

        async function flowPagePrev() {
            const step = Math.max(220, Math.floor(viewerFlow.clientHeight * 0.88));

            if (viewerFlow.scrollTop > 6) {
                viewerFlow.scrollBy({ top: -step, behavior: "smooth" });
                return;
            }

            const prevSection = getSectionByIndex(currentSectionIndex - 1);
            if (!prevSection) return;

            await renderSection(prevSection.href, "flow");
            requestAnimationFrame(() => {
                viewerFlow.scrollTop = viewerFlow.scrollHeight;
            });
        }

        async function flowPageNext() {
            const step = Math.max(220, Math.floor(viewerFlow.clientHeight * 0.88));
            const maxScrollTop = Math.max(0, viewerFlow.scrollHeight - viewerFlow.clientHeight);

            if (viewerFlow.scrollTop < maxScrollTop - 6) {
                viewerFlow.scrollBy({ top: step, behavior: "smooth" });
                return;
            }

            const nextSection = getSectionByIndex(currentSectionIndex + 1);
            if (!nextSection) return;

            await renderSection(nextSection.href, "flow");
            requestAnimationFrame(() => {
                viewerFlow.scrollTop = 0;
            });
        }

        async function withNavLock(fn) {
            if (navBusy) return;
            navBusy = true;
            try {
                await fn();
            } finally {
                setTimeout(() => {
                    navBusy = false;
                }, NAV_LOCK_MS);
            }
        }

        async function ensureRendition() {
            if (rendition) return rendition;

            rendition = book.renderTo("viewer-rendition", {
                width: "100%",
                height: "100%",
                spread: isMobileLike() ? "none" : "auto",
                manager: "default",
                flow: "paginated",
                allowScriptedContent: true
            });

            rendition.themes.default({
                body: {
                    background: "#f8f5ef",
                    color: "#1f2630",
                    "line-height": "1.7",
                    "font-family": "\"PingFang SC\", \"Noto Serif CJK SC\", Georgia, serif"
                },
                "p, li": {
                    "font-size": "1rem"
                },
                img: {
                    "max-width": "100%"
                }
            });

            rendition.hooks.content.register((contents) => {
                contents.document.addEventListener("click", async (e) => {
                    const anchor = closestAnchor(e.target);
                    if (!anchor) return;

                    const raw = anchor.getAttribute("href") || "";
                    if (isExternalHref(raw)) {
                        return;
                    }

                    e.preventDefault();

                    if (raw.startsWith("#")) {
                        const base = normalizeHref(contents.section.href);
                        await renderSection(base + raw, "rendition");
                        return;
                    }

                    const resolved = resolveRelativeHref(contents.section.href, raw);
                    await renderSection(resolved.displayHref, "rendition");
                }, true);

                attachMobileTapRecognizer(contents.document, {
                    getWidth: () => contents.window.innerWidth,
                    onPrev: async () => { await prevAction(); },
                    onNext: async () => { await nextAction(); },
                    onCenter: async () => { toggleChrome(); }
                });
            });

            rendition.on("relocated", (location) => {
                const start = location && location.start ? location.start : {};
                if (start.href) {
                    currentHref = normalizeHref(start.href);
                    currentDisplayHref = start.cfi || start.href || currentHref;
                }

                if (typeof start.index === "number") {
                    currentSectionIndex = start.index;
                } else {
                    const idx = spineItems.findIndex(item => normalizeHref(item.href) === currentHref);
                    currentSectionIndex = idx >= 0 ? idx : 0;
                }

                markActiveToc(currentHref);
                updateButtons();
                updatePageInfo();
            });

            rendition.on("rendered", () => {
                clearError();
            });

            rendition.on("displayError", (err) => {
                console.warn("Rendition display error:", err);
                showError("This chapter failed in rendition mode.");
            });

            return rendition;
        }

        async function resizeRenditionSafe() {
            if (!rendition) return;
            try {
                rendition.spread(isMobileLike() ? "none" : "auto");
                rendition.resize();
            } catch {}
        }

        async function renderFlow(displayHref, cleanHref, section) {
            setMode("flow");
            currentDisplayHref = displayHref || cleanHref;

            await section.load(book.load.bind(book));

            let markup = "";
            try {
                markup = await section.render();
            } catch {
                if (section.document && section.document.body) {
                    markup = section.document.body.innerHTML;
                } else {
                    throw new Error("Failed to render section in flow mode.");
                }
            }

            const parsed = new DOMParser().parseFromString(markup, "text/html");
            if (!parsed || !parsed.body) {
                throw new Error("Failed to parse section HTML.");
            }

            viewerFlow.innerHTML = parsed.body.innerHTML;
            rewriteFlowResources(section);
            viewerFlow.scrollTop = 0;

            currentHref = cleanHref;
            currentSectionIndex = typeof section.index === "number" ? section.index : 0;
            markActiveToc(cleanHref);
            updateButtons();
            updatePageInfo();

            const fragment = getFragment(displayHref);
            if (fragment) {
                scrollToFragmentInFlow(fragment);
            }

            if (typeof section.unload === "function") {
                section.unload();
            }

            clearError();
        }

        async function renderRendition(displayHref, cleanHref, section) {
            setMode("rendition");
            currentDisplayHref = displayHref || cleanHref;

            const r = await ensureRendition();

            currentHref = cleanHref;
            currentSectionIndex = typeof section.index === "number" ? section.index : 0;
            markActiveToc(cleanHref);
            updateButtons();
            updatePageInfo();

            await resizeRenditionSafe();
            await r.display(currentDisplayHref || cleanHref);
            await resizeRenditionSafe();
            clearError();
        }

        async function renderSection(href, forcedMode = null) {
            const displayHref = String(href || "");
            const cleanHref = normalizeHref(displayHref);
            const section = getSectionByHref(cleanHref);

            if (!section) {
                showError(`Render failed: section not found: ${cleanHref}`);
                return;
            }

            const primaryMode = forcedMode || effectiveMode();
            const backupMode = primaryMode === "rendition" ? "flow" : "rendition";

            try {
                if (primaryMode === "rendition") {
                    await renderRendition(displayHref, cleanHref, section);
                } else {
                    await renderFlow(displayHref, cleanHref, section);
                }
            } catch (err1) {
                console.warn(`Primary render failed in ${primaryMode}, trying ${backupMode}`, err1);

                try {
                    if (backupMode === "rendition") {
                        await renderRendition(displayHref, cleanHref, section);
                    } else {
                        await renderFlow(displayHref, cleanHref, section);
                    }

                    showError(`Primary mode failed. Switched to ${backupMode}.`);
                } catch (err2) {
                    console.error("Both render modes failed.", err1, err2);
                    showError("This chapter failed in both flow and rendition mode.");
                }
            }
        }

        async function prevAction() {
            await withNavLock(async () => {
                clearError();

                if (currentMode === "flow" && isMobileLike()) {
                    await flowPagePrev();
                    return;
                }

                if (currentMode === "rendition" && rendition) {
                    try {
                        await rendition.prev();
                        return;
                    } catch {}
                }

                const prevSection = getSectionByIndex(currentSectionIndex - 1);
                if (prevSection) {
                    await renderSection(prevSection.href, currentMode === "rendition" ? "rendition" : "flow");
                }
            });
        }

        async function nextAction() {
            await withNavLock(async () => {
                clearError();

                if (currentMode === "flow" && isMobileLike()) {
                    await flowPageNext();
                    return;
                }

                if (currentMode === "rendition" && rendition) {
                    try {
                        await rendition.next();
                        return;
                    } catch {}
                }

                const nextSection = getSectionByIndex(currentSectionIndex + 1);
                if (nextSection) {
                    await renderSection(nextSection.href, currentMode === "rendition" ? "rendition" : "flow");
                }
            });
        }

        function installUi() {
            menuBtn.addEventListener("click", toggleSidebar);
            closeSidebarBtn.addEventListener("click", closeSidebar);
            sidebarOverlayEl.addEventListener("click", closeSidebar);

            flowBtn.addEventListener("click", async () => {
                const href = currentDisplayHref || currentHref || (spineItems[0] ? spineItems[0].href : "");
                if (href) await renderSection(href, "flow");
            });

            renditionBtn.addEventListener("click", async () => {
                const href = currentDisplayHref || currentHref || (spineItems[0] ? spineItems[0].href : "");
                if (href) await renderSection(href, "rendition");
            });

            prevBtn.addEventListener("click", prevAction);
            nextBtn.addEventListener("click", nextAction);

            window.addEventListener("keydown", async (e) => {
                if (e.key === "ArrowLeft" || e.key === "PageUp") {
                    e.preventDefault();
                    await prevAction();
                } else if (e.key === "ArrowRight" || e.key === "PageDown") {
                    e.preventDefault();
                    await nextAction();
                } else if (e.key.toLowerCase() === "m") {
                    e.preventDefault();
                    toggleSidebar();
                } else if (e.key.toLowerCase() === "h") {
                    e.preventDefault();
                    if (isMobileLike()) toggleChrome();
                }
            });

            window.addEventListener("resize", async () => {
                await resizeRenditionSafe();
            });

            window.addEventListener("orientationchange", async () => {
                setTimeout(async () => {
                    await resizeRenditionSafe();
                }, 120);
            });
        }

        async function start() {
            installUi();
            installFlowTouchBehavior();

            try {
                book = ePub(EPUB_URL);
                await book.ready;

                spineItems =
                    (book.spine && (book.spine.spineItems || book.spine.items)) ||
                    [];

                const nav = await book.loaded.navigation;
                tocEntries = flattenToc(nav && nav.toc ? nav.toc : []);
                buildToc();

                if (!spineItems.length) {
                    viewerFlow.innerHTML = `<div class="status error">No readable spine found.</div>`;
                    setMode("flow");
                    return;
                }

                const initialHref = spineItems[0].href;
                const initialMode = effectiveMode();

                await renderSection(initialHref, initialMode);
                updateButtons();
                updatePageInfo();
            } catch (err) {
                console.error("Book init failed:", err);
                setMode("flow");
                viewerFlow.innerHTML = `<div class="status error">Failed to load this EPUB.</div>`;
                showError("Failed to load this EPUB.");
            }
        }

        start();
    </script>
</body>
</html>
