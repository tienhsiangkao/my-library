<!-- Reader UI only. Edit manually. No import script may overwrite this file. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ .Title }}</title>

    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js"></script>

    <style>
        :root {
            --bg: #0f1115;
            --panel: #171a21;
            --panel-2: #1d2330;
            --text: #e8ecf3;
            --muted: #9aa4b2;
            --accent: #4f8cff;
            --accent-2: #7aa7ff;
            --border: rgba(255,255,255,0.08);
            --shadow: 0 10px 30px rgba(0,0,0,0.28);
            --reader-max: 860px;
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: linear-gradient(180deg, #0d1015 0%, #11161d 100%);
            color: var(--text);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        body {
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button {
            border: none;
            cursor: pointer;
            font: inherit;
        }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 14px;
            border-bottom: 1px solid var(--border);
            background: rgba(15,17,21,0.88);
            backdrop-filter: blur(10px);
        }

        .top-left,
        .top-right {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }

        .nav-btn,
        .control-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 40px;
            padding: 0 14px;
            border-radius: 12px;
            background: rgba(255,255,255,0.05);
            color: var(--text);
            border: 1px solid var(--border);
            white-space: nowrap;
        }

        .nav-btn:hover,
        .control-btn:hover {
            background: rgba(255,255,255,0.08);
        }

        .book-meta {
            min-width: 0;
        }

        .book-title {
            margin: 0;
            font-size: 16px;
            line-height: 1.25;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .book-subtitle {
            margin: 4px 0 0;
            font-size: 12px;
            color: var(--muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #topbar-right {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            min-width: 0;
            flex-shrink: 0;
        }

        #mode-switcher {
            display: flex;
            align-items: center;
            gap: 4px;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 3px;
        }

        .mode-btn {
            border: none;
            background: transparent;
            color: var(--text);
            font-size: 12px;
            line-height: 1;
            padding: 8px 10px;
            cursor: pointer;
            border-radius: 8px;
        }

        .mode-btn:hover {
            background: rgba(255,255,255,0.06);
        }

        .mode-btn.active {
            background: #2f6fed;
            color: #fff;
        }

        .shell {
            flex: 1;
            min-height: 0;
            display: flex;
            overflow: hidden;
        }

        .sidebar {
            width: 290px;
            flex: 0 0 290px;
            border-right: 1px solid var(--border);
            background: rgba(255,255,255,0.02);
            overflow-y: auto;
            padding: 16px 14px 18px;
        }

        .sidebar h2 {
            margin: 0 0 12px;
            font-size: 14px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--muted);
        }

        .toc-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .toc-item {
            display: block;
            width: 100%;
            padding: 10px 12px;
            border-radius: 12px;
            border: 1px solid transparent;
            background: transparent;
            color: #dbe2ee;
            text-align: left;
            font-size: 14px;
            line-height: 1.35;
        }

        .toc-item:hover,
        .toc-item.active {
            background: rgba(79,140,255,0.12);
            border-color: rgba(122,167,255,0.22);
        }

        .main {
            flex: 1;
            min-width: 0;
            min-height: 0;
            display: flex;
            flex-direction: column;
        }

        .stage {
            flex: 1;
            min-height: 0;
            display: flex;
            justify-content: center;
            align-items: stretch;
            padding: 18px;
            overflow: hidden;
        }

        #viewer-flow,
        #viewer-rendition {
            width: 100%;
            max-width: var(--reader-max);
            min-height: 0;
            border-radius: 18px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            background: #f8f5ef;
            color: #1f2630;
        }

        #viewer-flow {
            display: none;
            overflow-y: auto;
            padding: 28px 24px 40px;
            line-height: 1.8;
            font-size: 18px;
        }

        #viewer-rendition {
            display: none;
            overflow: hidden;
            min-height: 100%;
        }

        .status {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 220px;
            color: #475569;
            font-size: 16px;
        }

        #viewer-flow h1,
        #viewer-flow h2,
        #viewer-flow h3,
        #viewer-flow h4,
        #viewer-flow h5,
        #viewer-flow h6 {
            position: static !important;
            display: block !important;
            line-height: 1.35 !important;
            margin: 1.4em 0 0.7em !important;
            color: #111827 !important;
            letter-spacing: normal !important;
            overflow-wrap: break-word;
        }

        #viewer-flow p,
        #viewer-flow li,
        #viewer-flow blockquote {
            overflow-wrap: break-word;
        }

        #viewer-flow img,
        #viewer-flow svg,
        #viewer-flow video,
        #viewer-flow canvas,
        #viewer-flow table {
            max-width: 100% !important;
            height: auto !important;
        }

        #viewer-flow pre,
        #viewer-flow code {
            white-space: pre-wrap;
            word-break: break-word;
        }

        #viewer-flow a {
            color: #1d4ed8;
            text-decoration: underline;
        }

        .controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 12px 14px calc(12px + env(safe-area-inset-bottom));
            border-top: 1px solid var(--border);
            background: rgba(15,17,21,0.88);
            backdrop-filter: blur(10px);
        }

        .controls-left,
        .controls-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .chapter-info {
            min-width: 0;
            color: var(--muted);
            font-size: 14px;
            text-align: center;
            padding: 0 10px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .drawer-backdrop {
            display: none;
        }

        @media (max-width: 900px) {
            .sidebar {
                position: fixed;
                top: 0;
                left: 0;
                z-index: 70;
                width: min(82vw, 320px);
                height: 100dvh;
                transform: translateX(-100%);
                transition: transform 0.22s ease;
                background: #121721;
                box-shadow: 0 20px 50px rgba(0,0,0,0.45);
            }

            body.toc-open .sidebar {
                transform: translateX(0);
            }

            .drawer-backdrop {
                position: fixed;
                inset: 0;
                z-index: 60;
                background: rgba(0,0,0,0.45);
            }

            body.toc-open .drawer-backdrop {
                display: block;
            }

            .stage {
                padding: 12px;
            }

            #viewer-flow,
            #viewer-rendition {
                border-radius: 14px;
            }

            #viewer-flow {
                padding: 22px 16px 28px;
                font-size: 17px;
            }
        }

        @media (max-width: 820px) {
            #mode-switcher {
                gap: 2px;
                padding: 2px;
            }

            .mode-btn {
                font-size: 11px;
                padding: 7px 8px;
            }
        }

        @media (max-width: 640px) {
            .chapter-info {
                font-size: 12px;
            }
        }

        @media (max-width: 520px) {
            .topbar {
                align-items: flex-start;
            }

            .top-left {
                flex: 1;
                min-width: 0;
            }

            .controls {
                display: grid;
                grid-template-columns: 1fr auto 1fr;
                align-items: center;
            }

            .controls-left {
                justify-content: flex-start;
            }

            .controls-right {
                justify-content: flex-end;
            }

            .chapter-info {
                text-align: center;
                font-size: 11px;
            }
        }

        @media (orientation: landscape) and (max-width: 900px) {
            .topbar {
                padding-top: 8px;
                padding-bottom: 8px;
            }

            .stage {
                padding: 8px;
            }

            #viewer-flow {
                padding: 18px 16px 22px;
            }

            .controls {
                padding-top: 8px;
                padding-bottom: calc(8px + env(safe-area-inset-bottom));
            }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="top-left">
            <a class="nav-btn" id="backBtn" href="{{ "/books/" | relURL }}">← Library</a>
            <button class="nav-btn" id="menuBtn" type="button">☰ Contents</button>

            <div class="book-meta">
                <h1 class="book-title">{{ .Title }}</h1>
                <p class="book-subtitle">{{ or .Params.author "Unknown Author" }}</p>
            </div>
        </div>

        <div class="top-right" id="topbar-right">
            <div id="mode-switcher" aria-label="Reading mode">
                <button class="mode-btn" data-mode="flow" type="button">Flow</button>
                <button class="mode-btn" data-mode="auto" type="button">Auto</button>
                <button class="mode-btn" data-mode="rendition" type="button">Rendition</button>
            </div>
        </div>
    </header>

    <div class="drawer-backdrop" id="drawerBackdrop"></div>

    <div class="shell">
        <aside class="sidebar" id="sidebar">
            <h2>Contents</h2>
            <div class="toc-list" id="tocList">
                <button class="toc-item active" type="button">Loading…</button>
            </div>
        </aside>

        <main class="main">
            <section class="stage">
                <div id="viewer-flow">
                    <div class="status">Loading book…</div>
                </div>
                <div id="viewer-rendition"></div>
            </section>

            <footer class="controls">
                <div class="controls-left">
                    <button class="control-btn" id="prevBtn" type="button">← Prev</button>
                </div>

                <div class="chapter-info" id="pageInfo">Preparing book…</div>

                <div class="controls-right">
                    <button class="control-btn" id="nextBtn" type="button">Next →</button>
                </div>
            </footer>
        </main>
    </div>

    <script>
        (() => {
            const bookUrl = `{{ (printf "books/%s" .Params.epub_file) | relURL }}`;
            const defaultMode = '{{ .Params.reader_mode | default "auto" }}'.toLowerCase();
            const modeStorageKey = `reader-mode:${bookUrl}`;
            let preferredMode = (localStorage.getItem(modeStorageKey) || defaultMode).toLowerCase();

            const book = ePub(bookUrl);

            const viewerFlow = document.getElementById('viewer-flow');
            const viewerRendition = document.getElementById('viewer-rendition');
            const tocList = document.getElementById('tocList');
            const pageInfo = document.getElementById('pageInfo');
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            const menuBtn = document.getElementById('menuBtn');
            const drawerBackdrop = document.getElementById('drawerBackdrop');
            const modeButtons = document.querySelectorAll('.mode-btn');

            const progressKey = `reader-progress:${bookUrl}`;

            let rendition = null;
            let spineItems = [];
            let currentHref = '';
            let currentSectionIndex = 0;
            let lastEffectiveMode = null;
            let saveTimer = null;

            function getProgress() {
                try {
                    return JSON.parse(localStorage.getItem(progressKey) || '{}');
                } catch {
                    return {};
                }
            }

            function saveProgress(patch) {
                const existing = getProgress();
                const next = { ...existing, ...patch, updatedAt: Date.now() };
                localStorage.setItem(progressKey, JSON.stringify(next));
            }

            function effectiveMode() {
                if (preferredMode === 'flow' || preferredMode === 'rendition') {
                    return preferredMode;
                }
                const isMobile = window.matchMedia('(max-width: 820px)').matches;
                return isMobile ? 'flow' : 'rendition';
            }

            function setMode() {
                const mode = effectiveMode();
                viewerFlow.style.display = mode === 'flow' ? 'block' : 'none';
                viewerRendition.style.display = mode === 'rendition' ? 'block' : 'none';
                lastEffectiveMode = mode;
            }

            function updateModeButtons() {
                modeButtons.forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.mode === preferredMode);
                });
            }

            async function switchMode(mode) {
                const next = String(mode || 'auto').toLowerCase();
                if (!['flow', 'auto', 'rendition'].includes(next)) return;

                const oldEffective = effectiveMode();
                preferredMode = next;
                localStorage.setItem(modeStorageKey, preferredMode);
                updateModeButtons();

                const newEffective = effectiveMode();
                if (currentHref && oldEffective !== newEffective) {
                    await renderSection(currentHref);
                } else {
                    setMode();
                    updatePageInfo();
                }
            }

            function openToc() {
                document.body.classList.add('toc-open');
            }

            function closeToc() {
                document.body.classList.remove('toc-open');
            }

            menuBtn.addEventListener('click', () => {
                document.body.classList.contains('toc-open') ? closeToc() : openToc();
            });

            drawerBackdrop.addEventListener('click', closeToc);

            function flattenToc(items, depth = 0) {
                const out = [];
                (items || []).forEach(item => {
                    out.push({
                        label: item.label || 'Untitled',
                        href: item.href || '',
                        depth
                    });
                    if (item.subitems && item.subitems.length) {
                        out.push(...flattenToc(item.subitems, depth + 1));
                    }
                });
                return out;
            }

            function buildToc(items) {
                const flat = flattenToc(items || []);
                tocList.innerHTML = '';

                if (!flat.length) {
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'toc-item active';
                    btn.textContent = 'No table of contents';
                    tocList.appendChild(btn);
                    return;
                }

                flat.forEach(item => {
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'toc-item';
                    btn.dataset.href = (item.href || '').split('#')[0];
                    btn.style.paddingLeft = `${12 + item.depth * 14}px`;
                    btn.textContent = item.label;

                    btn.addEventListener('click', async () => {
                        closeToc();
                        await renderSection(item.href);
                    });

                    tocList.appendChild(btn);
                });
            }

            function setActiveToc(href) {
                const clean = (href || '').split('#')[0];
                tocList.querySelectorAll('.toc-item').forEach(el => {
                    el.classList.toggle('active', el.dataset.href === clean);
                });
            }

            function updatePageInfo() {
                const total = spineItems.length || 0;
                const mode = effectiveMode();
                if (!total) {
                    pageInfo.textContent = `No chapters · ${mode}`;
                    return;
                }
                pageInfo.textContent = `Chapter ${currentSectionIndex + 1} / ${total} · ${mode}`;
            }

            function updateNavButtons() {
                const total = spineItems.length || 0;
                prevBtn.disabled = currentSectionIndex <= 0;
                nextBtn.disabled = currentSectionIndex >= total - 1;
                prevBtn.style.opacity = prevBtn.disabled ? '0.45' : '1';
                nextBtn.style.opacity = nextBtn.disabled ? '0.45' : '1';
            }

            function getSectionByHref(href) {
                const clean = (href || '').split('#')[0];
                try {
                    const found = book.spine.get(clean);
                    if (found) return found;
                } catch {}

                const found = spineItems.find(item => item && item.href === clean);
                return found || spineItems[0] || null;
            }

            function hrefToIndex(href) {
                const clean = (href || '').split('#')[0];
                const idx = spineItems.findIndex(item => item && item.href === clean);
                return idx >= 0 ? idx : 0;
            }

            function resolveInternalHref(rawHref) {
                if (!rawHref) return '';
                if (rawHref.startsWith('#')) {
                    const base = (currentHref || '').split('#')[0];
                    return `${base}${rawHref}`;
                }
                return rawHref;
            }

            function rewriteFlowLinks() {
                viewerFlow.querySelectorAll('a[href]').forEach(a => {
                    const raw = a.getAttribute('href') || '';
                    if (!raw) return;

                    if (
                        raw.startsWith('http://') ||
                        raw.startsWith('https://') ||
                        raw.startsWith('mailto:') ||
                        raw.startsWith('tel:')
                    ) {
                        a.setAttribute('target', '_blank');
                        a.setAttribute('rel', 'noopener noreferrer');
                        return;
                    }

                    a.addEventListener('click', async (e) => {
                        const href = resolveInternalHref(raw);

                        if (href.startsWith('#')) return;

                        e.preventDefault();
                        await renderSection(href);
                    });
                });
            }

            function jumpToHashInFlow(href) {
                const hash = href.includes('#') ? href.split('#')[1] : '';
                if (!hash) return;

                const id = decodeURIComponent(hash);
                const target =
                    viewerFlow.querySelector(`[id="${CSS.escape(id)}"]`) ||
                    viewerFlow.querySelector(`[name="${CSS.escape(id)}"]`);

                if (target) {
                    target.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }
            }

            async function ensureRendition() {
                if (rendition) return rendition;

                rendition = book.renderTo('viewer-rendition', {
                    width: '100%',
                    height: '100%',
                    flow: 'paginated',
                    spread: 'auto',
                    manager: 'default'
                });

                rendition.themes.default({
                    body: {
                        'background': '#f8f5ef',
                        'color': '#1f2630',
                        'line-height': '1.7'
                    },
                    'p, li': {
                        'font-size': '1rem'
                    }
                });

                rendition.on('relocated', (location) => {
                    const start = location && location.start ? location.start : {};
                    currentHref = start.href || currentHref || '';
                    currentSectionIndex = typeof start.index === 'number' ? start.index : hrefToIndex(currentHref);
                    setActiveToc(currentHref);
                    updatePageInfo();
                    updateNavButtons();

                    saveProgress({
                        href: currentHref,
                        sectionIndex: currentSectionIndex,
                        renditionCfi: start.cfi || null
                    });
                });

                return rendition;
            }

            async function renderFlow(href) {
                try {
                    const section = getSectionByHref(href);
                    if (!section) throw new Error('Section not found');

                    await section.load(book.load.bind(book));

                    const doc = section.document;
                    if (!doc || !doc.body) {
                        throw new Error('Section body unavailable');
                    }

                    viewerFlow.innerHTML = doc.body.innerHTML;
                    rewriteFlowLinks();

                    currentHref = href || section.href || '';
                    currentSectionIndex = typeof section.index === 'number' ? section.index : hrefToIndex(currentHref);
                    setActiveToc(currentHref);
                    updatePageInfo();
                    updateNavButtons();

                    const progress = getProgress();
                    const sameSection = progress.href && progress.href.split('#')[0] === currentHref.split('#')[0];
                    const scrollTop = sameSection && typeof progress.flowScrollTop === 'number' ? progress.flowScrollTop : 0;

                    requestAnimationFrame(() => {
                        viewerFlow.scrollTop = scrollTop;
                        jumpToHashInFlow(currentHref);
                    });

                    saveProgress({
                        href: currentHref,
                        sectionIndex: currentSectionIndex,
                        flowScrollTop: scrollTop
                    });
                } catch (err) {
                    console.error('Flow render error:', err);
                    viewerFlow.innerHTML = `
                        <div class="status" style="display:block;padding:24px;color:#7f1d1d;">
                            <p><strong>This chapter failed in flow mode.</strong></p>
                            <p>Try switching to <code>Rendition</code> for this book.</p>
                        </div>
                    `;
                }
            }

            async function renderRendition(target) {
                try {
                    const r = await ensureRendition();
                    const progress = getProgress();
                    const finalTarget = target || progress.renditionCfi || progress.href || undefined;
                    await r.display(finalTarget);
                } catch (err) {
                    console.error('Rendition render error:', err);
                }
            }

            async function renderSection(target) {
                setMode();
                const mode = effectiveMode();

                if (mode === 'flow') {
                    await renderFlow(target || currentHref || (spineItems[0] && spineItems[0].href) || '');
                } else {
                    await renderRendition(target || currentHref || (spineItems[0] && spineItems[0].href) || undefined);
                }
            }

            prevBtn.addEventListener('click', async () => {
                if (effectiveMode() === 'rendition') {
                    if (rendition) await rendition.prev();
                    return;
                }

                if (currentSectionIndex > 0) {
                    const prev = spineItems[currentSectionIndex - 1];
                    if (prev) await renderSection(prev.href);
                }
            });

            nextBtn.addEventListener('click', async () => {
                if (effectiveMode() === 'rendition') {
                    if (rendition) await rendition.next();
                    return;
                }

                if (currentSectionIndex < spineItems.length - 1) {
                    const next = spineItems[currentSectionIndex + 1];
                    if (next) await renderSection(next.href);
                }
            });

            viewerFlow.addEventListener('scroll', () => {
                clearTimeout(saveTimer);
                saveTimer = setTimeout(() => {
                    saveProgress({
                        href: currentHref,
                        sectionIndex: currentSectionIndex,
                        flowScrollTop: viewerFlow.scrollTop
                    });
                }, 200);
            });

            modeButtons.forEach(btn => {
                btn.addEventListener('click', async () => {
                    await switchMode(btn.dataset.mode);
                });
            });

            let resizeTimer = null;
            window.addEventListener('resize', () => {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(async () => {
                    const now = effectiveMode();
                    if (preferredMode === 'auto' && lastEffectiveMode && now !== lastEffectiveMode) {
                        await renderSection(currentHref || (spineItems[0] && spineItems[0].href) || '');
                    } else {
                        setMode();
                        updatePageInfo();
                    }
                }, 180);
            });

            book.ready.then(async () => {
                spineItems = book.spine && book.spine.items ? book.spine.items : [];
                buildToc(book.navigation && book.navigation.toc ? book.navigation.toc : []);
                updateModeButtons();
                setMode();

                const progress = getProgress();
                const initialTarget = progress.href || (spineItems[0] && spineItems[0].href) || '';

                await renderSection(initialTarget);
            }).catch(err => {
                console.error('Book init error:', err);
                viewerFlow.style.display = 'block';
                viewerRendition.style.display = 'none';
                viewerFlow.innerHTML = `
                    <div class="status" style="display:block;padding:24px;color:#7f1d1d;">
                        <p><strong>Failed to open this book.</strong></p>
                    </div>
                `;
            });
        })();
    </script>
</body>
</html>
