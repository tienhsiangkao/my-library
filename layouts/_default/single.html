<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>{{ .Title }}</title>

    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js"></script>

    <style>
        :root {
            --bg-1: #0d1015;
            --bg-2: #11161d;
            --panel: rgba(15,17,21,0.82);
            --paper: #f8f5ef;
            --paper-text: #1f2630;
            --text: #e8ecf3;
            --muted: #9aa4b2;
            --accent: #4f8cff;
            --border: rgba(255,255,255,0.08);
            --shadow: 0 12px 36px rgba(0,0,0,0.32);

            --sidebar-width: 300px;
            --topbar-height: 58px;
            --controls-height: 60px;
            --reader-width: 1800px;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 100%);
            color: var(--text);
            font-family: Inter, "PingFang SC", "SF Pro Display", "Segoe UI", sans-serif;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button {
            border: none;
            cursor: pointer;
            font: inherit;
        }

        #app {
            display: flex;
            width: 100%;
            height: 100dvh;
            min-height: 100dvh;
            overflow: hidden;
        }

        #sidebar-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.45);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
            z-index: 40;
        }

        #sidebar {
            width: var(--sidebar-width);
            flex-shrink: 0;
            background: var(--panel);
            border-right: 1px solid var(--border);
            overflow-y: auto;
            padding: 18px 16px 24px;
            z-index: 50;
            backdrop-filter: blur(10px);
        }

        #sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 12px;
        }

        #sidebar h3 {
            margin: 0;
            color: var(--accent);
            font-size: 18px;
        }

        #closeSidebarBtn {
            display: none;
            background: transparent;
            color: var(--text);
            font-size: 24px;
            line-height: 1;
            padding: 4px 8px;
        }

        #toc-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .toc-item {
            width: 100%;
            padding: 10px 12px;
            border-radius: 12px;
            border: 1px solid transparent;
            background: transparent;
            color: #dbe2ee;
            text-align: left;
            font-size: 14px;
            line-height: 1.4;
            word-break: break-word;
        }

        .toc-item:hover,
        .toc-item.active {
            background: rgba(79,140,255,0.12);
            border-color: rgba(79,140,255,0.24);
        }

        #main {
            flex: 1;
            min-width: 0;
            min-height: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #topbar {
            height: var(--topbar-height);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 0 14px;
            border-bottom: 1px solid var(--border);
            background: var(--panel);
            backdrop-filter: blur(10px);
        }

        #topbar-left,
        #topbar-right {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }

        #topbar-title {
            flex: 1;
            min-width: 0;
            text-align: center;
            font-size: 15px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .icon-btn,
        .nav-btn,
        .mode-btn,
        .spread-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 40px;
            padding: 0 14px;
            border-radius: 12px;
            color: var(--text);
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            white-space: nowrap;
        }

        .icon-btn:hover,
        .nav-btn:hover,
        .mode-btn:hover,
        .spread-btn:hover {
            background: rgba(255,255,255,0.08);
        }

        .mode-btn.active,
        .spread-btn.active {
            background: rgba(79,140,255,0.18);
            color: #eef4ff;
        }

        #viewer-wrap {
            flex: 1;
            min-height: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: stretch;
            padding: 18px;
            position: relative;
        }

        .viewer-panel {
            display: none;
            width: min(var(--reader-width), calc(100vw - var(--sidebar-width) - 44px));
            height: 100%;
            min-height: 0;
            background: var(--paper);
            color: var(--paper-text);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: var(--shadow);
            position: relative;
        }

        .viewer-panel.active {
            display: block;
        }

        #viewer-flow {
            width: 100%;
            height: 100%;
            min-height: 0;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
            touch-action: pan-y;
            padding: 44px 56px 52px;
            line-height: 1.9;
            font-size: 19px;
        }

        #viewer-flow .flow-content {
            width: 100%;
            max-width: 100%;
        }

        #viewer-rendition {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: relative;
        }

        .status {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 220px;
            color: #475569;
            font-size: 16px;
        }

        .error {
            color: #b42318;
        }

        #viewer-flow h1,
        #viewer-flow h2,
        #viewer-flow h3,
        #viewer-flow h4,
        #viewer-flow h5,
        #viewer-flow h6 {
            position: static !important;
            display: block !important;
            float: none !important;
            clear: both !important;
            line-height: 1.38 !important;
            margin: 1.35em 0 0.72em !important;
            color: #111827 !important;
            letter-spacing: normal !important;
            overflow-wrap: break-word;
        }

        #viewer-flow p,
        #viewer-flow li,
        #viewer-flow blockquote {
            overflow-wrap: break-word;
        }

        #viewer-flow img,
        #viewer-flow svg,
        #viewer-flow video,
        #viewer-flow canvas,
        #viewer-flow table,
        #viewer-flow iframe,
        #viewer-flow embed,
        #viewer-flow object {
            max-width: 100% !important;
            height: auto !important;
        }

        #viewer-flow pre,
        #viewer-flow code {
            white-space: pre-wrap;
            word-break: break-word;
        }

        #viewer-flow table {
            display: block;
            overflow-x: auto;
        }

        .controls {
            height: var(--controls-height);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 0 18px calc(env(safe-area-inset-bottom) * 0.35);
            border-top: 1px solid var(--border);
            background: var(--panel);
            backdrop-filter: blur(10px);
        }

        #page-info {
            flex: 1;
            min-width: 0;
            text-align: center;
            color: var(--muted);
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #message {
            position: absolute;
            left: 50%;
            bottom: calc(var(--controls-height) + 14px);
            transform: translateX(-50%);
            z-index: 80;
            background: rgba(15,17,21,0.92);
            color: #fff;
            padding: 10px 14px;
            border-radius: 12px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.18s ease;
            max-width: min(92vw, 680px);
            text-align: center;
            font-size: 13px;
        }

        #message.show {
            opacity: 1;
        }

        body.sidebar-open #sidebar-overlay {
            opacity: 1;
            pointer-events: auto;
        }

        @media (max-width: 1100px) {
            :root {
                --reader-width: 100vw;
            }

            .viewer-panel {
                width: calc(100vw - var(--sidebar-width) - 40px);
            }

            #viewer-flow {
                padding: 30px 28px 36px;
                font-size: 18px;
            }
        }

        @media (max-width: 900px) {
            :root {
                --topbar-height: 54px;
                --controls-height: 54px;
            }

            #sidebar {
                position: fixed;
                left: 0;
                top: 0;
                bottom: 0;
                width: min(82vw, 360px);
                max-width: 82vw;
                transform: translateX(-100%);
                transition: transform 0.2s ease;
            }

            body.sidebar-open #sidebar {
                transform: translateX(0);
            }

            #closeSidebarBtn {
                display: inline-flex;
            }

            #viewer-wrap {
                padding: 0;
            }

            .viewer-panel {
                width: 100%;
                border-radius: 0;
                box-shadow: none;
            }

            #viewer-flow {
                padding: 20px 16px 28px;
                font-size: 17px;
                line-height: 1.8;
            }

            #topbar-right .spread-btn,
            #topbar-right .nav-btn {
                display: none;
            }

            .controls .nav-btn {
                display: none;
            }
        }

        @media (hover: none) and (pointer: coarse) and (orientation: landscape) and (max-height: 520px) {
            :root {
                --topbar-height: 48px;
                --controls-height: 46px;
            }

            #topbar {
                padding: 0 8px;
            }

            #topbar-title {
                font-size: 14px;
            }

            #viewer-flow {
                padding: 12px 16px 18px;
                font-size: 15px;
                line-height: 1.72;
            }
        }

        body.chrome-hidden #topbar,
        body.chrome-hidden .controls {
            display: none;
        }

        body.chrome-hidden #viewer-wrap {
            padding-top: 0;
            padding-bottom: 0;
        }
    </style>
</head>
<body>
    <div id="sidebar-overlay"></div>

    <div id="app">
        <aside id="sidebar" aria-label="Table of contents">
            <div id="sidebar-header">
                <h3>目录</h3>
                <button id="closeSidebarBtn" type="button" aria-label="Close menu">×</button>
            </div>
            <div id="toc-list">正在提取目录…</div>
        </aside>

        <main id="main">
            <div id="topbar">
                <div id="topbar-left">
                    <a id="backBtn" class="icon-btn" href='{{ "books/" | relURL }}' aria-label="Back to library">←</a>
                    <button id="menuBtn" class="icon-btn" type="button" aria-label="Open menu">☰</button>
                </div>

                <div id="topbar-title">{{ .Title }}</div>

                <div id="topbar-right">
                    <button id="flowBtn" class="mode-btn" type="button">Flow</button>
                    <button id="renditionBtn" class="mode-btn" type="button">Rendition</button>
                    <button id="singlePageBtn" class="spread-btn" type="button">1P</button>
                    <button id="doublePageBtn" class="spread-btn" type="button">2P</button>
                </div>
            </div>

            <div id="viewer-wrap">
                <div id="flowPanel" class="viewer-panel active">
                    <div id="viewer-flow">
                        <div class="status">Loading…</div>
                    </div>
                </div>

                <div id="renditionPanel" class="viewer-panel">
                    <div id="viewer-rendition"></div>
                </div>
            </div>

            <div class="controls">
                <button id="prevBtn" class="nav-btn" type="button">← Prev</button>
                <div id="page-info">Loading…</div>
                <button id="nextBtn" class="nav-btn" type="button">Next →</button>
            </div>

            <div id="message"></div>
        </main>
    </div>

    <script>
        (() => {
            const EPUB_URL = `{{ (printf "books/%s" .Params.epub_file) | relURL }}`;
            const MODE_STORAGE_KEY = `reader-mode:${EPUB_URL}`;
            const SPREAD_STORAGE_KEY = `reader-spread:${EPUB_URL}`;
            const DEFAULT_MODE = `{{ .Params.reader_mode | default "flow" }}`.toLowerCase();

            const MOBILE_BREAKPOINT = 900;
            const TOUCH_MOVE_THRESHOLD = 14;
            const TAP_MAX_DURATION_MS = 350;
            const NAV_LOCK_MS = 240;

            const bodyEl = document.body;
            const sidebarOverlayEl = document.getElementById("sidebar-overlay");
            const closeSidebarBtn = document.getElementById("closeSidebarBtn");
            const menuBtn = document.getElementById("menuBtn");
            const tocList = document.getElementById("toc-list");

            const flowPanel = document.getElementById("flowPanel");
            const renditionPanel = document.getElementById("renditionPanel");
            const viewerFlow = document.getElementById("viewer-flow");
            const viewerRendition = document.getElementById("viewer-rendition");

            const flowBtn = document.getElementById("flowBtn");
            const renditionBtn = document.getElementById("renditionBtn");
            const singlePageBtn = document.getElementById("singlePageBtn");
            const doublePageBtn = document.getElementById("doublePageBtn");

            const prevBtn = document.getElementById("prevBtn");
            const nextBtn = document.getElementById("nextBtn");
            const pageInfo = document.getElementById("page-info");
            const messageEl = document.getElementById("message");

            let book = null;
            let rendition = null;
            let spineItems = [];
            let tocEntries = [];
            let currentMode = "flow";
            let currentHref = "";
            let currentDisplayHref = "";
            let currentSectionIndex = 0;
            let chromeVisible = true;
            let navBusy = false;
            let lastNavAt = 0;
            let spreadMode = localStorage.getItem(SPREAD_STORAGE_KEY) || "single";
            let flowHeadNodes = [];
            let suppressClickUntil = 0;

            function isMobileLike() {
                return window.matchMedia(`(max-width: ${MOBILE_BREAKPOINT}px)`).matches;
            }

            function showMessage(text) {
                messageEl.textContent = String(text || "");
                messageEl.classList.add("show");
                clearTimeout(showMessage._timer);
                showMessage._timer = setTimeout(() => {
                    messageEl.classList.remove("show");
                }, 1800);
            }

            function lockNav() {
                const now = Date.now();
                if (navBusy || now - lastNavAt < NAV_LOCK_MS) return false;
                navBusy = true;
                lastNavAt = now;
                return true;
            }

            function unlockNav() {
                navBusy = false;
            }

            function normalizeHref(href) {
                const raw = String(href || "").trim();
                if (!raw) return "";
                if (raw.startsWith("epubcfi(")) return raw;

                const clean = raw.split("?")[0].split("#")[0].replace(/\\/g, "/");
                const parts = [];

                clean.split("/").forEach(part => {
                    if (!part || part === ".") return;
                    if (part === "..") {
                        parts.pop();
                        return;
                    }
                    parts.push(part);
                });

                let out = parts.join("/");
                try { out = decodeURIComponent(out); } catch {}
                return out.replace(/^\/+/, "");
            }

            function getFragment(href) {
                const raw = String(href || "");
                const i = raw.indexOf("#");
                return i >= 0 ? raw.slice(i + 1) : "";
            }

            function dirname(href) {
                const clean = normalizeHref(href);
                if (!clean || !clean.includes("/")) return "";
                return clean.slice(0, clean.lastIndexOf("/") + 1);
            }

            function isExternalHref(href) {
                return /^(https?:|mailto:|tel:|javascript:|data:|blob:|\/\/)/i.test(String(href || "").trim());
            }

            function flattenToc(items, depth = 0, out = []) {
                (items || []).forEach(item => {
                    out.push({
                        label: String(item.label || "Untitled").trim(),
                        href: String(item.href || ""),
                        depth
                    });
                    if (item.subitems && item.subitems.length) {
                        flattenToc(item.subitems, depth + 1, out);
                    }
                });
                return out;
            }

            function getTocBaseHref() {
                if (!book) return "";
                const packaging = book.packaging || {};
                return normalizeHref(packaging.navPath || packaging.ncxPath || "");
            }

            function markActiveToc(href) {
                const clean = normalizeHref(href);
                document.querySelectorAll(".toc-item").forEach(btn => {
                    btn.classList.toggle("active", btn.dataset.href === clean);
                });
            }

            function setChromeVisible(visible) {
                chromeVisible = !!visible;
                bodyEl.classList.toggle("chrome-hidden", !chromeVisible);
                if (currentMode === "rendition") {
                    requestAnimationFrame(stabilizeRenditionLayout);
                }
            }

            function toggleChrome() {
                if (!isMobileLike()) return;
                setChromeVisible(!chromeVisible);
            }

            function openSidebar() {
                bodyEl.classList.add("sidebar-open");
            }

            function closeSidebar() {
                bodyEl.classList.remove("sidebar-open");
            }

            function clearError() {
                viewerFlow.querySelectorAll(".status.error").forEach(node => node.remove());
                messageEl.classList.remove("show");
            }

            function showError(text) {
                const msg = String(text || "Unknown render error");
                console.error(msg);

                if (currentMode === "rendition") {
                    viewerRendition.innerHTML = "";
                }

                viewerFlow.innerHTML = `<div class="status error">${msg}</div>`;
                flowPanel.classList.add("active");
                renditionPanel.classList.remove("active");
                currentMode = "flow";
                updateModeButtons();
                updateButtons();
                pageInfo.textContent = msg;
            }

            function setMode(mode) {
                currentMode = mode === "rendition" ? "rendition" : "flow";
                flowPanel.classList.toggle("active", currentMode === "flow");
                renditionPanel.classList.toggle("active", currentMode === "rendition");
                updateModeButtons();
                updateButtons();
                updatePageInfo();

                if (currentMode === "rendition") {
                    requestAnimationFrame(stabilizeRenditionLayout);
                }
            }

            function effectiveMode() {
                const stored = (localStorage.getItem(MODE_STORAGE_KEY) || DEFAULT_MODE || "flow").toLowerCase();
                return stored === "rendition" ? "rendition" : "flow";
            }

            function saveMode(mode) {
                localStorage.setItem(MODE_STORAGE_KEY, mode);
            }

            function saveSpread(mode) {
                localStorage.setItem(SPREAD_STORAGE_KEY, mode);
            }

            function updateModeButtons() {
                flowBtn.classList.toggle("active", currentMode === "flow");
                renditionBtn.classList.toggle("active", currentMode === "rendition");
                singlePageBtn.classList.toggle("active", spreadMode === "single");
                doublePageBtn.classList.toggle("active", spreadMode === "double");
                doublePageBtn.style.display = isMobileLike() ? "none" : "inline-flex";
            }

            function updateButtons() {
                if (currentMode === "flow") {
                    const atTop = viewerFlow.scrollTop <= 6;
                    const atBottom = viewerFlow.scrollTop >= Math.max(0, viewerFlow.scrollHeight - viewerFlow.clientHeight - 6);
                    prevBtn.disabled = atTop && currentSectionIndex <= 0;
                    nextBtn.disabled = atBottom && currentSectionIndex >= spineItems.length - 1;
                    return;
                }
                prevBtn.disabled = false;
                nextBtn.disabled = false;
            }

            function updatePageInfo() {
                const total = spineItems.length || 0;
                const chapter = total ? `${currentSectionIndex + 1}/${total}` : "0/0";
                const hit = tocEntries.find(item => normalizeHref(item.href) === normalizeHref(currentHref));
                const label = hit && hit.label ? ` · ${hit.label}` : "";
                const modeText = currentMode === "rendition"
                    ? (spreadMode === "double" && !isMobileLike() ? "Rendition 2P" : "Rendition 1P")
                    : "Flow";

                pageInfo.textContent = `${modeText} · ${chapter}${label}`;
            }

            function getCurrentDisplayHref() {
                return currentDisplayHref || currentHref || (spineItems[0] && spineItems[0].href) || "";
            }

            function pathCandidates(rawPath, baseHref = "") {
                const set = new Set();
                const baseDir = dirname(baseHref);

                function addCandidate(value) {
                    const norm = normalizeHref(value);
                    if (!norm) return;
                    set.add(norm);
                    try { set.add(encodeURI(norm)); } catch {}
                    try { set.add(decodeURIComponent(norm)); } catch {}
                }

                addCandidate(rawPath);

                try {
                    const url = new URL(String(rawPath || ""), `https://book.local/${baseDir}`);
                    addCandidate(url.pathname.replace(/^\/+/, ""));
                } catch {}

                const direct = normalizeHref(rawPath);
                if (direct && !direct.includes("/") && baseDir) {
                    addCandidate(`${baseDir}${direct}`);
                }

                return Array.from(set);
            }

            function findSectionByHref(rawHref, baseHref = "") {
                const candidates = pathCandidates(rawHref, baseHref);
                if (!candidates.length) return null;

                for (const candidate of candidates) {
                    try {
                        const direct = book.spine.get(candidate);
                        if (direct) return direct;
                    } catch {}
                }

                for (const candidate of candidates) {
                    const exact = spineItems.find(item => normalizeHref(item && item.href) === candidate);
                    if (exact) return exact;
                }

                for (const candidate of candidates) {
                    const lower = candidate.toLowerCase();
                    const matches = spineItems.filter(item => normalizeHref(item && item.href).toLowerCase() === lower);
                    if (matches.length === 1) return matches[0];
                }

                for (const candidate of candidates) {
                    const base = candidate.split("/").pop();
                    if (!base) continue;
                    const matches = spineItems.filter(item => {
                        const href = normalizeHref(item && item.href);
                        return href && href.split("/").pop() === base;
                    });
                    if (matches.length === 1) return matches[0];
                }

                return null;
            }

            function resolveBookHref(rawHref, baseHref = "") {
                const raw = String(rawHref || "").trim();
                if (!raw) {
                    return { displayHref: "", cleanHref: "", fragment: "", section: null, external: false };
                }

                if (raw.startsWith("epubcfi(")) {
                    return { displayHref: raw, cleanHref: raw, fragment: "", section: null, external: false };
                }

                if (isExternalHref(raw)) {
                    return { displayHref: raw, cleanHref: raw, fragment: "", section: null, external: true };
                }

                const fragment = getFragment(raw);
                let pathPart = raw.split("#")[0];

                if (!pathPart) {
                    pathPart = normalizeHref(baseHref);
                }

                const section = findSectionByHref(pathPart, baseHref);
                const cleanHref = section ? normalizeHref(section.href) : normalizeHref(pathPart);
                const displayHref = fragment ? `${cleanHref}#${fragment}` : cleanHref;

                return { displayHref, cleanHref, fragment, section, external: false };
            }

            function removeFlowHeadNodes() {
                flowHeadNodes.forEach(node => {
                    try { node.remove(); } catch {}
                });
                flowHeadNodes = [];
            }

            function parseLoadedSection(loaded) {
                if (!loaded) return null;

                if (typeof loaded === "string") {
                    const parser = new DOMParser();
                    let doc = null;
                    try {
                        doc = parser.parseFromString(loaded, "application/xhtml+xml");
                        if (doc && doc.querySelector("parsererror")) throw new Error("xhtml parse failed");
                    } catch {
                        doc = parser.parseFromString(loaded, "text/html");
                    }
                    return doc;
                }

                if (loaded.nodeType === 9) return loaded;
                if (loaded.ownerDocument && loaded.ownerDocument.nodeType === 9) return loaded.ownerDocument;
                if (loaded.documentElement) return loaded;
                if (loaded.contents && loaded.contents.document) return loaded.contents.document;
                return null;
            }

            function appendFlowHeadAssets(doc, section) {
                removeFlowHeadNodes();
                if (!doc || !doc.head) return;

                Array.from(doc.head.children).forEach(node => {
                    const tag = node.tagName ? node.tagName.toLowerCase() : "";
                    if (tag !== "style" && tag !== "link") return;

                    const clone = node.cloneNode(true);

                    if (tag === "link") {
                        const rel = String(clone.getAttribute("rel") || "").toLowerCase();
                        if (rel !== "stylesheet") return;

                        const href = clone.getAttribute("href");
                        if (href && !isExternalHref(href)) {
                            try {
                                clone.setAttribute("href", section.resolve(href));
                            } catch {}
                        }
                    }

                    clone.setAttribute("data-flow-asset", "1");
                    document.head.appendChild(clone);
                    flowHeadNodes.push(clone);
                });
            }

            function scrollToFragmentInFlow(fragment) {
                if (!fragment) return;

                let target = null;

                try {
                    const safe = window.CSS && CSS.escape ? CSS.escape(fragment) : fragment;
                    target =
                        viewerFlow.querySelector(`#${safe}`) ||
                        viewerFlow.querySelector(`[name="${safe}"]`);
                } catch {}

                if (!target) {
                    target =
                        viewerFlow.querySelector(`[id="${fragment}"]`) ||
                        viewerFlow.querySelector(`[name="${fragment}"]`);
                }

                if (target) {
                    target.scrollIntoView({ behavior: "auto", block: "start" });
                }
            }

            function rewriteFlowResources(section) {
                viewerFlow.querySelectorAll("[src]").forEach(el => {
                    const src = el.getAttribute("src");
                    if (!src || isExternalHref(src)) return;
                    try { el.setAttribute("src", section.resolve(src)); } catch {}
                });

                viewerFlow.querySelectorAll("[poster]").forEach(el => {
                    const poster = el.getAttribute("poster");
                    if (!poster || isExternalHref(poster)) return;
                    try { el.setAttribute("poster", section.resolve(poster)); } catch {}
                });

                viewerFlow.querySelectorAll("image").forEach(el => {
                    const href = el.getAttribute("href") || el.getAttribute("xlink:href");
                    if (!href || isExternalHref(href)) return;
                    try {
                        const resolved = section.resolve(href);
                        el.setAttribute("href", resolved);
                        el.setAttribute("xlink:href", resolved);
                    } catch {}
                });

                viewerFlow.querySelectorAll("a[href]").forEach(a => {
                    const raw = a.getAttribute("href");
                    if (!raw) return;

                    if (isExternalHref(raw)) {
                        a.setAttribute("target", "_blank");
                        a.setAttribute("rel", "noopener noreferrer");
                        return;
                    }

                    const handler = async (event) => {
                        event.preventDefault();
                        event.stopPropagation();

                        const resolved = resolveBookHref(raw, currentHref);
                        if (!resolved.displayHref && resolved.fragment) {
                            scrollToFragmentInFlow(resolved.fragment);
                            return;
                        }

                        if (!resolved.cleanHref || resolved.cleanHref === currentHref) {
                            scrollToFragmentInFlow(resolved.fragment);
                            return;
                        }

                        await renderSection(raw, "flow", currentHref);
                    };

                    a.addEventListener("click", handler, true);
                    a.addEventListener("touchend", (event) => {
                        event.preventDefault();
                        event.stopPropagation();
                        handler(event);
                    }, { passive: false, capture: true });
                });
            }

            function setCurrentFromSection(section, displayHref = "") {
                if (!section) return;

                currentHref = normalizeHref(section.href);
                currentDisplayHref = displayHref || currentHref;
                currentSectionIndex = typeof section.index === "number"
                    ? section.index
                    : Math.max(0, spineItems.findIndex(item => normalizeHref(item && item.href) === currentHref));

                markActiveToc(currentHref);
                updateButtons();
                updatePageInfo();
            }

            async function renderFlow(targetHref, baseHref = currentHref) {
                const resolved = resolveBookHref(targetHref, baseHref);
                const section = resolved.section || findSectionByHref(resolved.cleanHref);

                if (!section) {
                    throw new Error(`section not found: ${targetHref}`);
                }

                const loaded = await section.load(book.load.bind(book));
                const parsed = parseLoadedSection(loaded);
                if (!parsed) {
                    throw new Error("section parse failed");
                }

                appendFlowHeadAssets(parsed, section);

                const body = parsed.body || parsed.querySelector("body");
                const html = body ? body.innerHTML : (parsed.documentElement ? parsed.documentElement.innerHTML : "");
                viewerFlow.innerHTML = `<div class="flow-content">${html}</div>`;

                rewriteFlowResources(section);

                setMode("flow");
                setCurrentFromSection(section, resolved.displayHref);
                viewerFlow.scrollTop = 0;

                if (resolved.fragment) {
                    requestAnimationFrame(() => scrollToFragmentInFlow(resolved.fragment));
                }

                if (typeof section.unload === "function") {
                    try { section.unload(); } catch {}
                }
            }

            function applyRenditionSpread() {
                if (!rendition) return;
                const spread = isMobileLike()
                    ? "none"
                    : (spreadMode === "double" ? "auto" : "none");
                try { rendition.spread(spread); } catch {}
            }

            function stabilizeRenditionLayout() {
                if (!rendition || currentMode !== "rendition") return;

                applyRenditionSpread();

                const rect = viewerRendition.getBoundingClientRect();
                if (!rect.width || !rect.height) return;

                try {
                    rendition.resize(rect.width, rect.height);
                } catch {}

                setTimeout(() => {
                    if (!rendition || currentMode !== "rendition") return;
                    const rect2 = viewerRendition.getBoundingClientRect();
                    if (!rect2.width || !rect2.height) return;
                    try {
                        applyRenditionSpread();
                        rendition.resize(rect2.width, rect2.height);
                    } catch {}
                }, 100);
            }

            function locationToken(loc) {
                if (!loc || !loc.start) return "";
                return `${loc.start.href || ""}|${loc.start.cfi || ""}`;
            }

            function waitForRelocation(timeout = 900) {
                return new Promise(resolve => {
                    if (!rendition) {
                        resolve(null);
                        return;
                    }

                    let done = false;

                    const finish = (loc = null) => {
                        if (done) return;
                        done = true;
                        try { rendition.off("relocated", onRelocated); } catch {}
                        resolve(loc);
                    };

                    const onRelocated = (loc) => finish(loc);
                    rendition.on("relocated", onRelocated);

                    setTimeout(() => {
                        try { finish(rendition.currentLocation ? rendition.currentLocation() : null); }
                        catch { finish(null); }
                    }, timeout);
                });
            }

            function closestAnchor(startNode) {
                let node = startNode;
                while (node) {
                    if (node.nodeType === 1 && node.tagName && node.tagName.toLowerCase() === "a" && node.getAttribute("href")) {
                        return node;
                    }
                    node = node.parentNode;
                }
                return null;
            }

            function handleRenditionTap(ratio) {
                if (!isMobileLike() || currentMode !== "rendition") return;
                if (ratio <= 0.32) {
                    renditionPrev();
                } else if (ratio >= 0.68) {
                    renditionNext();
                } else {
                    toggleChrome();
                }
            }

            function bindRenditionContents(contents) {
                const doc = contents.document;
                if (!doc || doc.documentElement.dataset.readerBound === "1") return;
                doc.documentElement.dataset.readerBound = "1";

                const touchState = {
                    x: 0,
                    y: 0,
                    moved: false,
                    startedAt: 0
                };

                const touchStart = (event) => {
                    if (!event.touches || event.touches.length !== 1) return;
                    const touch = event.touches[0];
                    touchState.x = touch.clientX;
                    touchState.y = touch.clientY;
                    touchState.moved = false;
                    touchState.startedAt = Date.now();
                };

                const touchMove = (event) => {
                    if (!event.touches || event.touches.length !== 1) return;
                    const touch = event.touches[0];
                    if (
                        Math.abs(touch.clientX - touchState.x) > TOUCH_MOVE_THRESHOLD ||
                        Math.abs(touch.clientY - touchState.y) > TOUCH_MOVE_THRESHOLD
                    ) {
                        touchState.moved = true;
                    }
                };

                const activateInternalLink = async (anchor, event) => {
                    const rawHref = anchor.getAttribute("href") || "";
                    if (!rawHref) return false;

                    if (isExternalHref(rawHref)) {
                        anchor.setAttribute("target", "_blank");
                        anchor.setAttribute("rel", "noopener noreferrer");
                        return false;
                    }

                    event.preventDefault();
                    event.stopPropagation();
                    suppressClickUntil = Date.now() + 450;
                    await renderSection(
                        rawHref,
                        "rendition",
                        contents.section && contents.section.href ? contents.section.href : currentHref
                    );
                    return true;
                };

                doc.addEventListener("click", async (event) => {
                    if (Date.now() < suppressClickUntil) {
                        event.preventDefault();
                        event.stopPropagation();
                        return;
                    }

                    const anchor = closestAnchor(event.target);
                    if (anchor) {
                        await activateInternalLink(anchor, event);
                        return;
                    }

                    if (!isMobileLike() || currentMode !== "rendition") return;

                    const width = contents.window.innerWidth || doc.documentElement.clientWidth || 1;
                    const x = typeof event.clientX === "number" ? event.clientX : width / 2;
                    handleRenditionTap(x / width);
                    event.preventDefault();
                    event.stopPropagation();
                }, true);

                doc.addEventListener("touchstart", touchStart, { passive: true, capture: true });
                doc.addEventListener("touchmove", touchMove, { passive: true, capture: true });

                doc.addEventListener("touchend", async (event) => {
                    const anchor = closestAnchor(event.target);
                    if (anchor) {
                        await activateInternalLink(anchor, event);
                        return;
                    }

                    if (!isMobileLike() || currentMode !== "rendition") return;
                    if (touchState.moved) return;
                    if (Date.now() - touchState.startedAt > TAP_MAX_DURATION_MS) return;

                    const width = contents.window.innerWidth || doc.documentElement.clientWidth || 1;
                    handleRenditionTap(touchState.x / width);
                    suppressClickUntil = Date.now() + 450;
                    event.preventDefault();
                    event.stopPropagation();
                }, { passive: false, capture: true });
            }

            async function ensureRendition() {
                if (rendition) return rendition;

                rendition = book.renderTo("viewer-rendition", {
                    width: "100%",
                    height: "100%",
                    flow: "paginated",
                    spread: "none",
                    manager: "default",
                    allowScriptedContent: true
                });

                rendition.themes.default({
                    body: {
                        "background": "#f8f5ef",
                        "color": "#1f2630",
                        "line-height": "1.7",
                        "padding": "0",
                        "margin": "0 auto"
                    },
                    "html, body, div, p, li, blockquote": {
                        "overflow-wrap": "break-word"
                    },
                    "img, svg, video, canvas, table, iframe": {
                        "max-width": "100%",
                        "height": "auto"
                    }
                });

                rendition.hooks.content.register((contents) => {
                    bindRenditionContents(contents);
                });

                rendition.on("relocated", (location) => {
                    const href = location && location.start && location.start.href
                        ? normalizeHref(location.start.href)
                        : currentHref;

                    const section = href ? findSectionByHref(href) : null;
                    if (section) {
                        setCurrentFromSection(section, currentDisplayHref || href);
                    } else {
                        updatePageInfo();
                        updateButtons();
                    }
                });

                return rendition;
            }

            async function renderRendition(targetHref, baseHref = currentHref) {
                const resolved = resolveBookHref(targetHref, baseHref);
                const section = resolved.section || findSectionByHref(resolved.cleanHref);

                if (!section && !String(resolved.displayHref || "").startsWith("epubcfi(")) {
                    throw new Error(`section not found: ${targetHref}`);
                }

                setMode("rendition");
                await ensureRendition();

                setCurrentFromSection(
                    section || { href: resolved.cleanHref, index: currentSectionIndex },
                    resolved.displayHref
                );
                currentDisplayHref = resolved.displayHref || resolved.cleanHref;

                applyRenditionSpread();
                stabilizeRenditionLayout();

                const waitPromise = waitForRelocation();
                const beforeToken = locationToken(rendition.currentLocation ? rendition.currentLocation() : null);

                await rendition.display(resolved.displayHref || resolved.cleanHref);

                const loc = await waitPromise;
                const afterToken = locationToken(loc);

                if (beforeToken && afterToken && beforeToken === afterToken && resolved.fragment && isMobileLike()) {
                    setTimeout(() => rendition.display(resolved.displayHref || resolved.cleanHref), 60);
                }
            }

            async function renderSection(targetHref, forcedMode = null, baseHref = currentHref) {
                clearError();

                if (!lockNav()) return;

                try {
                    const mode = forcedMode || effectiveMode();
                    const resolved = resolveBookHref(targetHref, baseHref);

                    if (resolved.external) {
                        window.open(resolved.displayHref, "_blank", "noopener,noreferrer");
                        return;
                    }

                    if (mode === "rendition") {
                        await renderRendition(targetHref, baseHref);
                    } else {
                        await renderFlow(targetHref, baseHref);
                    }

                    if (isMobileLike()) {
                        closeSidebar();
                    }
                } catch (err) {
                    showError(`Render failed: ${err && err.message ? err.message : err}`);
                } finally {
                    unlockNav();
                }
            }

            async function renditionPrev() {
                if (!rendition || currentMode !== "rendition" || !lockNav()) return;
                try {
                    await rendition.prev();
                } finally {
                    unlockNav();
                }
            }

            async function renditionNext() {
                if (!rendition || currentMode !== "rendition" || !lockNav()) return;
                try {
                    await rendition.next();
                } finally {
                    unlockNav();
                }
            }

            async function flowPrev() {
                if (currentMode !== "flow") return;

                if (viewerFlow.scrollTop > 6) {
                    viewerFlow.scrollBy({
                        top: -Math.max(180, Math.floor(viewerFlow.clientHeight * 0.88)),
                        behavior: "smooth"
                    });
                    return;
                }

                if (currentSectionIndex <= 0) return;
                const prev = spineItems[currentSectionIndex - 1];
                if (prev) await renderSection(prev.href, "flow");
            }

            async function flowNext() {
                if (currentMode !== "flow") return;

                const remaining = viewerFlow.scrollHeight - viewerFlow.clientHeight - viewerFlow.scrollTop;
                if (remaining > 6) {
                    viewerFlow.scrollBy({
                        top: Math.max(180, Math.floor(viewerFlow.clientHeight * 0.88)),
                        behavior: "smooth"
                    });
                    return;
                }

                if (currentSectionIndex >= spineItems.length - 1) return;
                const next = spineItems[currentSectionIndex + 1];
                if (next) await renderSection(next.href, "flow");
            }

            function buildToc(items) {
                tocEntries = flattenToc(items || []);
                tocList.innerHTML = "";

                if (!tocEntries.length) {
                    tocList.innerHTML = `<div class="toc-item" style="cursor:default;opacity:.75">No table of contents</div>`;
                    return;
                }

                const tocBase = getTocBaseHref();

                tocEntries.forEach(item => {
                    const btn = document.createElement("button");
                    const resolved = resolveBookHref(item.href, tocBase);

                    btn.className = "toc-item";
                    btn.type = "button";
                    btn.dataset.href = normalizeHref(resolved.cleanHref || item.href);
                    btn.style.paddingLeft = `${12 + item.depth * 18}px`;
                    btn.textContent = item.label || "Untitled";

                    btn.addEventListener("click", async (event) => {
                        event.preventDefault();
                        event.stopPropagation();
                        await renderSection(item.href, currentMode, tocBase);
                    });

                    btn.addEventListener("touchend", async (event) => {
                        event.preventDefault();
                        event.stopPropagation();
                        suppressClickUntil = Date.now() + 450;
                        await renderSection(item.href, currentMode, tocBase);
                    }, { passive: false });

                    tocList.appendChild(btn);
                });
            }

            flowBtn.addEventListener("click", async () => {
                saveMode("flow");
                await renderSection(getCurrentDisplayHref(), "flow");
            });

            renditionBtn.addEventListener("click", async () => {
                saveMode("rendition");
                await renderSection(getCurrentDisplayHref(), "rendition");
            });

            singlePageBtn.addEventListener("click", () => {
                spreadMode = "single";
                saveSpread(spreadMode);
                updateModeButtons();
                stabilizeRenditionLayout();
            });

            doublePageBtn.addEventListener("click", () => {
                spreadMode = "double";
                saveSpread(spreadMode);
                updateModeButtons();
                stabilizeRenditionLayout();
            });

            prevBtn.addEventListener("click", async () => {
                if (currentMode === "rendition") {
                    await renditionPrev();
                } else {
                    await flowPrev();
                }
            });

            nextBtn.addEventListener("click", async () => {
                if (currentMode === "rendition") {
                    await renditionNext();
                } else {
                    await flowNext();
                }
            });

            viewerFlow.addEventListener("scroll", updateButtons, { passive: true });
            viewerFlow.addEventListener("scroll", updatePageInfo, { passive: true });

            menuBtn.addEventListener("click", () => {
                bodyEl.classList.contains("sidebar-open") ? closeSidebar() : openSidebar();
            });

            closeSidebarBtn.addEventListener("click", closeSidebar);
            sidebarOverlayEl.addEventListener("click", closeSidebar);

            document.addEventListener("keydown", async (event) => {
                if (event.key === "Escape") {
                    closeSidebar();
                    return;
                }

                if (event.key === "ArrowLeft") {
                    if (currentMode === "rendition") await renditionPrev();
                    else await flowPrev();
                }

                if (event.key === "ArrowRight") {
                    if (currentMode === "rendition") await renditionNext();
                    else await flowNext();
                }
            });

            window.addEventListener("resize", () => {
                updateModeButtons();
                updateButtons();

                if (!isMobileLike()) {
                    closeSidebar();
                    setChromeVisible(true);
                }

                if (currentMode === "rendition") {
                    stabilizeRenditionLayout();
                }
            });

            window.addEventListener("orientationchange", () => {
                setTimeout(() => {
                    updateModeButtons();
                    updateButtons();

                    if (currentMode === "rendition") {
                        stabilizeRenditionLayout();
                    }
                }, 180);
            });

            async function init() {
                try {
                    book = ePub(EPUB_URL);
                    await book.ready;

                    spineItems = (book.spine && (book.spine.spineItems || book.spine.items))
                        ? (book.spine.spineItems || book.spine.items)
                        : [];

                    let navigation = book.navigation;
                    try {
                        if (book.loaded && book.loaded.navigation) {
                            navigation = await book.loaded.navigation;
                        }
                    } catch {}

                    buildToc(navigation && navigation.toc ? navigation.toc : []);
                    updateModeButtons();

                    const initialTarget = (spineItems[0] && spineItems[0].href) || "";
                    const initialMode = effectiveMode();
                    await renderSection(initialTarget, initialMode, "");
                } catch (err) {
                    showError(`Failed to open this book: ${err && err.message ? err.message : err}`);
                }
            }

            init();
        })();
    </script>
</body>
</html>
